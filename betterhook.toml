# Git hooks via betterhook (https://crates.io/crates/betterhook-cli).
# Bootstrapped on first local cargo build by the hooks-install crate.
# Skip a job: BETTERHOOK_SKIP=cargo-fmt git commit ...
# Skip bootstrap: BETTERHOOK_BOOTSTRAP=0
# Emergency bypass: git commit --no-verify

[hooks.pre-commit]
parallel = false
# Avoid stashing the worktree: `cargo fmt`/`rustfmt` only touch `{staged_files}`,
# and stash/pop has conflicted with in-progress workspace edits.
stash_untracked = false

# rustfmt on staged paths (not `cargo fmt --`) so formatting still works when
# Cargo.toml workspace edits are unstaged during the commit.
[hooks.pre-commit.jobs.cargo-fmt]
run = "rustfmt --edition 2021 {staged_files}"
glob = ["*.rs"]
stage_fixed = true
