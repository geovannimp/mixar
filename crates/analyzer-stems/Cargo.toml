[package]
name = "analyzer-stems"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline stem separation for Mixar (HTDemucs via ort + StemSplit ONNX)"

[features]
# Desktop default: WebGPU (Vulkan/DX12/Metal) so GPUs work without a CUDA toolkit.
# Do not enable `cuda` and `webgpu` together — ort has no joint EP binary.
default = ["webgpu"]
cuda = ["ort/cuda"]
webgpu = ["ort/webgpu"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
tensorrt = ["ort/tensorrt"]
nvrtx = ["ort/nvrtx"]
openvino = ["ort/openvino"]

[dependencies]
anyhow.workspace = true
flacenc = "0.5"
hex = "0.4"
ort = "=2.0.0-rc.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
resampler = { path = "../resampler" }
ruopus = "0.1"
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
tracing.workspace = true

[dev-dependencies]
tempfile = "3.0"
