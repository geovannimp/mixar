[package]
name = "analyzer-stems"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline and live stem separation for Mixar (HTDemucs via ort + Mixxx ONNX)"

[features]
# No default EP: a dependency edge must never turn WebGPU on implicitly. Android
# loads Microsoft's ONNX Runtime AAR at runtime, which has no WebGPU EP, so the
# dispatch would fail to resolve its symbols. Desktop hosts opt in through
# host_flutter's `stems-webgpu`.
# Only one ORT EP feature — `cargo build --all-features` (moon CI) must not enable
# cuda/nvrtx alongside webgpu, or the desktop prebuilt resolver has no dist to pick.
default = []
webgpu = ["ort/webgpu"]

[dependencies]
anyhow.workspace = true
audio-core = { path = "../audio-core" }
flacenc = "0.5"
hex = "0.4"
libc = "0.2"
realfft = "3.5"
# Base spec: target-specific declarations below select the runtime ABI and
# linking strategy without leaking desktop defaults into Android or Intel macOS.
ort = { version = "=2.0.0-rc.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
resampler = { path = "../resampler" }
ruopus = "0.1"
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
tracing.workspace = true

# Most desktops use ort-sys's current prebuilt runtime (including WebGPU).
[target.'cfg(not(any(target_os = "android", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
ort = "=2.0.0-rc.14"

# Microsoft stopped shipping Intel macOS binaries after 1.23.2. The macOS build
# stages that official shared runtime for the Intel slice; request its ABI, not
# ort's default API 31. WebGPU is probed normally and falls back to CPU.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "api-23",
] }

# Android ships Microsoft's ONNX Runtime AAR (`com.microsoft.onnxruntime:
# onnxruntime-android`) and loads it at runtime: `load-dynamic` skips ort-sys's
# prebuilt resolution, and the EP features only expose dispatch types. `nnapi`
# and `xnnpack` are in that AAR; the rest are probed so the benchmark reports
# what the loaded runtime actually contains (they stay unavailable until a
# custom ONNX Runtime build ships them).

[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = [
    "api-31",
    "load-dynamic",
    "nnapi",
    "xnnpack",
    "acl",
    "qnn",
    "tvm",
    "azure",
] }

[dev-dependencies]
tempfile = "3.0"

[lints]
workspace = true
