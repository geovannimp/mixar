[package]
name = "analyzer-stems"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline stem separation for Mixar (HTDemucs via Burn)"

[features]
default = ["burn-ndarray", "burn-wgpu"]
burn-ndarray = ["burn/ndarray", "burn/simd"]
burn-wgpu = ["burn/wgpu", "dep:pollster", "dep:wgpu"]

[dependencies]
anyhow.workspace = true
burn = { version = "0.20", default-features = false, features = ["std"] }
half = "2"
safetensors = "0.5"
flacenc = "0.5"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
resampler = { path = "../resampler" }
ruopus = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
realfft = "3.5"
num-complex = "0.4"
tracing.workspace = true
# burn-wgpu: async tensor readback + adapter probe (release builds abort on panic).
pollster = { version = "0.4", optional = true }
# Same major as Burn's wgpu; keep default backends (Vulkan/Metal/DX12) for the probe.
wgpu = { version = "26", optional = true }

[dev-dependencies]
tempfile = "3.0"
