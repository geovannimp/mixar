[package]
name = "midi-map-probe"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0"
description = "Standalone MIDI→mapping probe (midir only; excluded from workspace)"

# Virtual workspace root so this package is not pulled into crates/Cargo.toml members.
[workspace]

[[bin]]
name = "midi-map-probe"
path = "src/main.rs"

[dependencies]
controller = { path = "../controller" }
library-api = { path = "../library-api" }
midir = "0.10"
