[package]
name = "host_flutter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = { workspace = true }
analytics = { path = "../analytics" }
analyzer-stems = { path = "../analyzer-stems" }
bus-api = { path = "../bus-api" }
engine-core = { path = "../engine-core" }
event-bus = { path = "../event-bus" }
fs-browser = { path = "../fs-browser" }
flutter_rust_bridge = "=2.13.0"
audio-core = { path = "../audio-core" }
codec = { path = "../codec" }
controller = { path = "../controller" }
library = { path = "../library" }
library-core = { path = "../library-core" }
library-adapters = { path = "../library-adapters" }
resampler = { path = "../resampler" }
serde = { workspace = true }
serde_json = "1.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }

[features]
# Exposes headless engine construction to this crate's own integration tests.
# Integration tests are separate crates and cannot see `pub(crate)`, so without a
# feature this hook would have to be unconditionally `pub`.
#
# Fragility note: "absent from production builds" relies on the workspace staying
# on `resolver = "2"` (see crates/Cargo.toml) AND on no crate ever listing
# `features = ["test-utils"]` on a normal `[dependencies]` entry.
test-utils = []

[dev-dependencies]
host_flutter = { path = ".", features = ["test-utils"] }
lofty = "0.25.5"
tempfile = "3.0"
rusqlite = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[lints]
workspace = true
