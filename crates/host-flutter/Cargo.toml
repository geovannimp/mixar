[package]
name = "host_flutter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = { workspace = true }
analytics = { path = "../analytics" }
analyzer-stems = { path = "../analyzer-stems", optional = true, default-features = false }
bus-api = { path = "../bus-api" }
engine-core = { path = "../engine-core" }
event-bus = { path = "../event-bus" }
fs-browser = { path = "../fs-browser" }
flutter_rust_bridge = "=2.13.0"
audio-core = { path = "../audio-core" }
codec = { path = "../codec" }
controller = { path = "../controller" }
library = { path = "../library", default-features = false, features = ["analysis"] }
library-core = { path = "../library-core" }
library-adapters = { path = "../library-adapters" }
resampler = { path = "../resampler" }
serde = { workspace = true }
serde_json = "1.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }

# Android: `MainActivity` hands the JavaVM and the Application context to
# `ndk-context`, which midir's Android MIDI backend and cpal's AAudio host read.
# A Flutter app has no `android_activity` glue crate to initialize it, so the
# first MIDI/audio call would panic with "android context was not initialized".
# `jni` is pinned to midir's version so the two share one build of the crate.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
# Offline + live stem separation (ONNX Runtime, via analyzer-stems).
# `stems-webgpu` is the desktop GPU EP. Android loads the Microsoft ONNX Runtime
# AAR at runtime instead, but every stem job there runs on the CPU EP (NNAPI,
# XNNPACK, QNN all measured slower), so mobile builds
# `--no-default-features --features stems` (see rust_builder/android/build.gradle).
default = ["stems", "stems-webgpu"]
stems = ["dep:analyzer-stems", "library/stems"]
stems-webgpu = ["analyzer-stems/webgpu", "library/stems-webgpu"]
# Exposes headless engine construction to this crate's own integration tests.
# Integration tests are separate crates and cannot see `pub(crate)`, so without a
# feature this hook would have to be unconditionally `pub`.
#
# Fragility note: "absent from production builds" relies on the workspace staying
# on `resolver = "2"` (see crates/Cargo.toml) AND on no crate ever listing
# `features = ["test-utils"]` on a normal `[dependencies]` entry.
test-utils = []

[dev-dependencies]
# `default-features = false`: a dev edge with defaults on would re-enable
# `stems` through feature unification, so `--no-default-features` test runs
# would silently compile the desktop arms instead of the platform arms.
host_flutter = { path = ".", default-features = false, features = ["test-utils"] }
lofty = "0.25.5"
tempfile = "3.0"
rusqlite = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[lints]
workspace = true
