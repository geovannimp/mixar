[package]
name = "host_flutter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = { workspace = true }
engine-api = { path = "../engine-api" }
engine-core = { path = "../engine-core" }
fs-browser = { path = "../fs-browser" }
flutter_rust_bridge = "=2.12.0"
audio-core = { path = "../audio-core" }
controller = { path = "../controller" }
library = { path = "../library" }
library-api = { path = "../library-api" }
library-core = { path = "../library-core" }
resampler = { path = "../resampler" }

[dev-dependencies]
lofty = "0.22"
tempfile = "3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
