[package]
name = "engine-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core engine orchestration for Mixar"

[features]
default = ["backend-cpal"]
backend-cpal = ["dep:backend-cpal", "backend-cpal/pipewire"]

[dependencies]
engine-api = { path = "../engine-api" }
omnibus = "0.1"
audio-core = { path = "../audio-core" }
analyzer-core = { path = "../analyzer-core" }
engine-dsp = { path = "../engine-dsp" }
library-core = { path = "../library-core" }
library = { path = "../library" }
library-api = { path = "../library-api" }
resampler = { path = "../resampler" }
backend-null = { path = "../backend-null" }
backend-miniaudio = { path = "../backend-miniaudio" }
backend-cpal = { path = "../backend-cpal", optional = true }
rtrb = "0.3"
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
log.workspace = true
tokio.workspace = true

[dev-dependencies]
library-core = { path = "../library-core" }
tempfile = "3.0"
