$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
layer: 'application'
id: 'rust'

workspace:
  inheritedTasks:
    include: []

env:
  CARGO_TERM_COLOR: 'always'

fileGroups:
  sources:
    - '**/*'
    - 'Cargo.toml'
    - 'Cargo.lock'

tasks:
  format-check:
    command: 'cargo'
    args: ['fmt', '--', '--check']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  # Pre-commit only (lefthook → moon --affected --status staged).
  # Inputs are .rs-only so this task is skipped when no Rust sources are staged
  # (avoids rustfmt hanging on empty stdin). Skip deleted paths — moon still
  # passes them and rustfmt errors on missing files.
  # Use a script file, not `bash -c '… "$@" …'`: moon may wrap the command in
  # another shell -c, which empties $@ and makes the hook a silent no-op.
  format-files:
    command: 'bash'
    args:
      - 'scripts/format-files.sh'
    inputs:
      - '**/*.rs'
      - 'scripts/format-files.sh'
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: 'args'
        filter:
          - '**/*.rs'
        passDotWhenNoResults: false

  # Pre-commit only. Clippy skipped: clang ≥21 + bindgen drops SPA_ID_INVALID /
  # PW_ID_ANY (pipewire-rs); default builds still use PipeWire. Full `lint` stays
  # for CI. Remove this skip when upstream/bindgen is fixed.
  lint-files:
    command: 'bash'
    args:
      - '-c'
      - 'echo "crates lint-files: skipping clippy (pipewire-rs/clang bindgen)"; exit 0'
    inputs:
      - '**/*.rs'
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: false
        filter:
          - '**/*.rs'
        passDotWhenNoResults: false

  lint:
    command: 'cargo'
    args:
      - 'clippy'
      - '--all-targets'
      - '--all-features'
      - '--'
      - '-D'
      - 'warnings'
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  test:
    command: 'cargo'
    args: ['test', '--verbose']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  build:
    command: 'cargo'
    args: ['build', '--all-targets', '--all-features']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  test-mappings:
    command: 'cargo'
    args:
      - 'run'
      - '-p'
      - 'controller'
      - '--bin'
      - 'map-check'
      - '--'
      - '--all'
      - '../mappings'
    inputs:
      - 'controller/**/*'
    options:
      runInCI: true

  test-mapping:
    command: 'cargo'
    args:
      - 'run'
      - '-p'
      - 'controller'
      - '--bin'
      - 'map-check'
      - '--'
    inputs:
      - 'controller/**/*'
    options:
      runInCI: false
      cache: false
      affectedFiles:
        pass: 'args'
