$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
layer: 'application'
id: 'rust'

workspace:
  inheritedTasks:
    include: []

env:
  CARGO_TERM_COLOR: 'always'

fileGroups:
  sources:
    - '**/*'
    - 'Cargo.toml'
    - 'Cargo.lock'

tasks:
  format-check:
    command: 'cargo'
    args: ['fmt', '--', '--check']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  # Pre-commit only (lefthook → moon --affected --status staged).
  # Inputs are .rs-only so this task is skipped when no Rust sources are staged
  # (avoids rustfmt hanging on empty stdin). `passDotWhenNoResults: false` skips
  # the task when the filter matches nothing. Skip deleted staged paths (rustfmt
  # errors if a path is missing).
  format-files:
    command: 'bash'
    args:
      - '-c'
      - 'files=(); for f in "$@"; do [ -f "$f" ] && files+=("$f"); done; [ "${#files[@]}" -eq 0 ] && exit 0; exec rustfmt --edition 2021 -- "${files[@]}"'
      - '_'
    inputs:
      - '**/*.rs'
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: 'args'
        filter:
          - '**/*.rs'
        passDotWhenNoResults: false

  # Pre-commit only (lefthook → moon --affected --status staged).
  # Same clippy as CI `lint`. `pass: false` so cargo does not get file path args;
  # `passDotWhenNoResults: false` skips when no `.rs` is staged.
  lint-files:
    command: 'cargo'
    args:
      - 'clippy'
      - '--all-targets'
      - '--all-features'
      - '--'
      - '-D'
      - 'warnings'
    inputs:
      - '**/*.rs'
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: false
        filter:
          - '**/*.rs'
        passDotWhenNoResults: false

  lint:
    command: 'cargo'
    args:
      - 'clippy'
      - '--all-targets'
      - '--all-features'
      - '--'
      - '-D'
      - 'warnings'
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  test:
    command: 'cargo'
    args: ['test', '--verbose']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  build:
    command: 'cargo'
    args: ['build', '--all-targets', '--all-features']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  test-mappings:
    command: 'cargo'
    args:
      - 'run'
      - '-p'
      - 'controller'
      - '--bin'
      - 'map-check'
      - '--'
      - '--all'
      - '../mappings'
    inputs:
      - 'controller/**/*'
    options:
      runInCI: true

  test-mapping:
    command: 'cargo'
    args:
      - 'run'
      - '-p'
      - 'controller'
      - '--bin'
      - 'map-check'
      - '--'
    inputs:
      - 'controller/**/*'
    options:
      runInCI: false
      cache: false
      affectedFiles:
        pass: 'args'
