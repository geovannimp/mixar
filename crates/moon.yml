$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
layer: 'application'
id: 'rust'

workspace:
  inheritedTasks:
    include: []

env:
  CARGO_TERM_COLOR: 'always'

fileGroups:
  sources:
    - '**/*'
    - 'Cargo.toml'
    - 'Cargo.lock'

tasks:
  format-check:
    command: 'cargo'
    args: ['fmt', '--', '--check']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  # Pre-commit only (lefthook → moon --affected --status staged).
  # Inputs are .rs-only so this task is skipped when no Rust sources are staged.
  # `pass: false` runs full `cargo fmt` (same as CI format-check) whenever any
  # `.rs` is staged — do not pass paths through `bash -c "...$@..."`; the Rust
  # toolchain wraps the task in another `bash -c`, which expands `$@` empty and
  # silently skips rustfmt. `passDotWhenNoResults: false` skips when none match.
  format-files:
    command: 'cargo'
    args: ['fmt']
    inputs:
      - '**/*.rs'
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: false
        filter:
          - '**/*.rs'
        passDotWhenNoResults: false

  # Pre-commit only (lefthook → moon --affected --status staged).
  # Same clippy as CI `lint`. `pass: false` so cargo does not get file path args;
  # `passDotWhenNoResults: false` skips when no `.rs` is staged.
  lint-files:
    command: 'cargo'
    args:
      - 'clippy'
      - '--all-targets'
      - '--all-features'
      - '--'
      - '-D'
      - 'warnings'
    inputs:
      - '**/*.rs'
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: false
        filter:
          - '**/*.rs'
        passDotWhenNoResults: false

  lint:
    command: 'cargo'
    args:
      - 'clippy'
      - '--all-targets'
      - '--all-features'
      - '--'
      - '-D'
      - 'warnings'
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  test:
    command: 'cargo'
    args: ['test', '--verbose']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  build:
    command: 'cargo'
    args: ['build', '--all-targets', '--all-features']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  # Invoked by name from .github/workflows/test.yml (`npm run test` → `moon run
  # :test` only matches tasks literally named `test`, and no workflow runs
  # `moon ci`, so `runInCI` alone would never schedule this).
  #
  # moon rejects `..` in `inputs`, and `mappings/` lives at the repo root rather
  # than under this project, so the bundles cannot be a cached input here. They
  # are instead validated by `crates/controller/tests/map_check.rs`
  # (`shipped_mappings_are_valid`) under the normal `test` task, and by this task
  # when CI invokes it by name.
  test-mappings:
    command: 'cargo'
    args:
      - 'run'
      - '-p'
      - 'controller'
      - '--bin'
      - 'map-check'
      - '--'
      - '--all'
      - '../mappings'
    inputs:
      - 'controller/**/*'
    options:
      runInCI: true

  test-mapping:
    command: 'cargo'
    args:
      - 'run'
      - '-p'
      - 'controller'
      - '--bin'
      - 'map-check'
      - '--'
    inputs:
      - 'controller/**/*'
    options:
      runInCI: false
      cache: false
      affectedFiles:
        pass: 'args'
