$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
layer: 'application'
id: 'rust'

workspace:
  inheritedTasks:
    include: []

env:
  CARGO_TERM_COLOR: 'always'

fileGroups:
  sources:
    - '**/*'
    - 'Cargo.toml'
    - 'Cargo.lock'

tasks:
  format-check:
    command: 'cargo'
    args: ['fmt', '--', '--check']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  # Pre-commit only (lefthook → moon --affected --status staged).
  # Inputs are .rs-only so this task is skipped when no Rust sources are staged
  # (avoids rustfmt hanging on empty stdin).
  format-files:
    command: 'rustfmt'
    args: ['--edition', '2021']
    inputs:
      - '**/*.rs'
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: 'args'
        filter:
          - '**/*.rs'
        passDotWhenNoResults: false

  lint:
    command: 'cargo'
    args:
      - 'clippy'
      - '--all-targets'
      - '--all-features'
      - '--'
      - '-D'
      - 'warnings'
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  test:
    command: 'cargo'
    args: ['test', '--verbose']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  build:
    command: 'cargo'
    args: ['build', '--all-targets', '--all-features']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true
