[workspace]
members = [
    "engine-api",
    "audio-core",
    "backend-null",
    "backend-cpal",
    "engine-core",
    "engine-dsp",
    "codec",
    "resampler",
    "stretch",
    "library-core",
    "fs-browser",
    "library-api",
    "library",
    "library-adapters",
    "analyzer-core",
    "analyzer-qmdsp",
    "analyzer",
    "analyzer-stems",
    "analytics",
    "controller",
    "host-flutter",
]
# Standalone midir probe — optional debug tool (own workspace; not required for the Flutter host).
resolver = "2"

# Lint policy shared by every crate (`[lints] workspace = true` in each member);
# the rule set it implements is documented in `.cursor/rules/rust.mdc`. Only
# lints that are NOT on by default belong here — the rest of that rule set is
# already enforced by clippy's default groups (`ptr_arg`, `borrowed_box`,
# `should_implement_trait`, `unnecessary_unwrap`, `unnecessary_to_owned`).
[workspace.lints.rust]
# `#[cfg(frb_expand)]` is emitted by flutter_rust_bridge during codegen.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
# No glob imports. The lint still permits globs in test code and `::prelude::*`.
wildcard_imports = "warn"
# `expect` over `unwrap`; `clippy.toml` exempts test code (`allow-unwrap-in-tests`).
unwrap_used = "warn"
# `Option<&T>` over `&Option<T>` — `ptr_arg`/`borrowed_box` do not cover this one.
ref_option = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/geovannimp/mixar"
description = "Modular Rust Audio Engine for DJ applications"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
dasp = { version = "0.11", features = ["slice"] }
dasp_graph = { version = "0.11", default-features = false, features = ["node-sum"] }
petgraph = "0.5"
rusqlite = { version = "0.38", features = ["bundled"] }

[profile.release]
# 3, not "z": "z" disables loop vectorization. See docs/tech-spec.md §13.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# At 0 the stem Opus encode costs 53.7 s vs 2.9 s in release.
opt-level = 1
# "line-tables-only" keeps file/line in backtraces, panics and test failures,
# but drops variable/type DWARF. Deps inherit this, so the win scales with the
# ~570-crate dependency graph: less debuginfo to emit, less to write, faster
# links and a much smaller target/ (CI cache + local disk).
# Need full debuginfo for a one-off debugging session? Override without
# editing this file:
#   cargo build --config 'profile.dev.debug="full"'
debug = "line-tables-only"
