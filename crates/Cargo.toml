[workspace]
members = [
    "engine-api",
    "audio-core",
    "backend-null",
    "backend-miniaudio",
    "backend-cpal",
    "engine-core",
    "engine-dsp",
    "codec",
    "resampler",
    "library-core",
    "library-api",
    "library",
    "library-adapters",
    "analyzer-core",
    "analyzer-stratum",
    "analyzer",
    "app-example",
    "controller",
    "host-flutter",
]
# Standalone midir probe — optional debug tool (own workspace; not required for gui-app).
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "GPL-3.0"
repository = "https://github.com/yourusername/rust-dj-engine"
description = "Modular Rust Audio Engine for DJ applications"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.10"
criterion = { version = "0.5", features = ["html_reports"] }
dasp = { version = "0.11", features = ["slice"] }
dasp_graph = { version = "0.11", default-features = false, features = ["node-sum"] }
petgraph = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# Temporary: clang ≥21 + published pipewire-rs 0.10.0 drops SPA_ID_INVALID / PW_ID_ANY
# (https://gitlab.freedesktop.org/pipewire/pipewire-rs/-/work_items/118).
# Fixed in !273; drop this patch when crates.io ships ≥0.10.1.
# See https://github.com/geovannimp/rust-dj-engine/issues/144
[patch.crates-io]
pipewire = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
pipewire-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
libspa = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
libspa-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
