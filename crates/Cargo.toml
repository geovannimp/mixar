[workspace]
members = [
    "engine-api",
    "audio-core",
    "backend-null",
    "backend-miniaudio",
    "backend-cpal",
    "engine-core",
    "engine-dsp",
    "codec",
    "resampler",
    "library-core",
    "library-api",
    "library",
    "library-adapters",
    "analyzer-core",
    "analyzer-stratum",
    "analyzer",
    "app-example",
    "controller",
]
# Standalone midir probe — must stay excluded (alsa-sys vs cpal).
exclude = ["midi-map-probe"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "GPL-3.0"
repository = "https://github.com/yourusername/rust-dj-engine"
description = "Modular Rust Audio Engine for DJ applications"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.10"
criterion = { version = "0.5", features = ["html_reports"] }
dasp = { version = "0.11", features = ["slice"] }
dasp_graph = { version = "0.11", default-features = false, features = ["node-sum"] }
petgraph = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
