[package]
name = "analyzer-qmdsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust port of Mixxx's qm-dsp analysis (beats + key)"

[dependencies]
analyzer-core = { path = "../analyzer-core" }
# RFC 3339 `analyzed_at` timestamps (same as `library`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# FFT: rustfft for the complex constant-Q kernel, realfft for the real-input
# STFT/CQT front ends. Both are pure Rust.
rustfft = "6"
realfft = "3"

[features]
# Gates the measurement-only surface the timing harness needs: with `sub` off,
# `analyzer_qmdsp::measurement` and the six pipeline modules do not exist and the
# crate's public API is exactly what it was before `examples/qmdsp_timing.rs`.
# Default-on so the documented one-command protocol
# (`cargo run --release -p analyzer-qmdsp --example qmdsp_timing`) works without
# flags; `--no-default-features` gives a genuinely smaller surface.
default = ["sub"]
sub = []
