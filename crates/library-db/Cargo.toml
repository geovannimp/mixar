[package]
name = "library-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Library schema, entities and migrations for Mixar"

[dependencies]
library-core = { path = "../library-core" }
migrator = { path = "../migrator" }
sea-orm-sync = { version = "2.0.4", default-features = false, features = [
    "rusqlite",
    "macros",
] }
jiff = { version = "1.0", default-features = false, features = ["std"] }
tracing.workspace = true

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3.0"

[lints]
workspace = true
