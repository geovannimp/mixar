[package]
name = "controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MIDI controller mapping bundles (device/map/Rhai) for the engine bus"

[[bin]]
name = "map-check"
path = "src/bin/map-check.rs"

[dependencies]
engine-api = { path = "../engine-api" }
library-api = { path = "../library-api" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Git pin: midir#199 widens alsa to <0.13 so we share alsa-sys with cpal 0.18.
# Switch to crates.io once a release includes that bound.
midir = { git = "https://github.com/Boddlnagg/midir", rev = "e5a60b5" }
rhai = { version = "1.21", default-features = false, features = ["std", "sync"] }

[features]
# Exposes test-only hooks to this crate's own integration tests. Integration
# tests are separate crates and cannot see `pub(crate)`, so without a feature
# these hooks would have to be unconditionally `pub`. Enabled only via the self
# dev-dependency below.
#
# Fragility note: "absent from production builds" relies on the workspace staying
# on `resolver = "2"` (see crates/Cargo.toml) AND on no crate ever listing
# `features = ["test-utils"]` on a normal `[dependencies]` entry. Either change
# would compile the test hooks into production artifacts.
test-utils = []

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
# Self dev-dependency so `tests/*` link the lib built with `test-utils` (the
# supported Cargo pattern for exposing test-only API to integration tests).
controller = { path = ".", features = ["test-utils"] }

