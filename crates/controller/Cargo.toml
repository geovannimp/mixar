[package]
name = "controller"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MIDI controller mapping bundles (device/map/Rhai) for the engine bus"

[[bin]]
name = "map-check"
path = "src/bin/map-check.rs"

[dependencies]
engine-api = { path = "../engine-api" }
library-api = { path = "../library-api" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
toml = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Git pin: midir#199 widens alsa to <0.13 so we share alsa-sys with cpal 0.18.
# Switch to crates.io once a release includes that bound.
midir = { git = "https://github.com/Boddlnagg/midir", rev = "e5a60b5" }
rhai = { version = "1.21", default-features = false, features = ["std", "sync"] }

[dev-dependencies]
tempfile = "3"
