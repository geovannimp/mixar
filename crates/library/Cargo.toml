[package]
name = "library"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Library manager for Mixar"

[dependencies]
library-core = { path = "../library-core" }
library-api = { path = "../library-api" }
audio-core = { path = "../audio-core" }
omnibus = "0.1"
lofty = "0.22"
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
sea-orm-sync = { version = "2.0.0", features = [
    "rusqlite",
    "entity-registry",
    "schema-sync",
] }
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
analyzer = { path = "../analyzer", optional = true }
analyzer-core = { path = "../analyzer-core", optional = true }
xspf = "0.4.2"
xml = "0.8"

[features]
default = ["analysis"]
analysis = ["dep:analyzer", "dep:analyzer-core"]

[dev-dependencies]
tempfile = "3.0"
