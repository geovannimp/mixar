[package]
name = "library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Library manager for Mixar"

[dependencies]
bus-api = { path = "../bus-api" }
event-bus = { path = "../event-bus" }
library-core = { path = "../library-core" }
audio-core = { path = "../audio-core" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
zstd = "0.14"
sea-orm-sync = { version = "2.0.0", features = [
    "rusqlite",
    "entity-registry",
    "schema-sync",
] }
rusqlite = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
analyzer = { path = "../analyzer", optional = true }
analyzer-core = { path = "../analyzer-core", optional = true }
analyzer-stems = { path = "../analyzer-stems", optional = true }
codec = { path = "../codec" }
xspf = "0.4.2"
xml = "0.8"
tracing.workspace = true

[features]
default = ["analysis"]
analysis = ["dep:analyzer", "dep:analyzer-core", "dep:analyzer-stems"]

[dev-dependencies]
tempfile = "3.0"
lofty = "0.25.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[lints]
workspace = true
