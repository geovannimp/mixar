[package]
name = "library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Library manager for Mixar"

[dependencies]
bus-api = { path = "../bus-api" }
event-bus = { path = "../event-bus" }
library-core = { path = "../library-core" }
audio-core = { path = "../audio-core" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
zstd = "0.14"
# The sync ORM: one connection, no executor, and it builds for wasm32 too.
# Migrations run on the same connection through `migrator`.
sea-orm-sync = { version = "2.0.4", default-features = false, features = [
    "rusqlite",
    "macros",
] }
library-db = { path = "../library-db" }
jiff = { version = "1.0", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
analyzer = { path = "../analyzer", optional = true }
analyzer-core = { path = "../analyzer-core" }
analyzer-stems = { path = "../analyzer-stems", optional = true, default-features = false }
codec = { path = "../codec" }
xspf = "0.4.2"
xml = "0.8"
tracing.workspace = true

[features]
default = ["analysis", "stems"]
# BPM/key analysis; also gates the stem mixdown analysis helpers.
analysis = ["dep:analyzer"]
# Offline stem separation (ONNX Runtime). Desktop resolves the prebuilt at build
# time; Android loads the Microsoft AAR at runtime (ort `load-dynamic`).
stems = ["analysis", "dep:analyzer-stems"]
# Desktop GPU EP passthrough; Android builds never enable it (the AAR has no
# WebGPU). host-flutter turns it on for desktop defaults.
stems-webgpu = ["stems", "analyzer-stems/webgpu"]

[dev-dependencies]
base64 = "0.22.1"
# Raw SQLite is only used by tests and fixtures.
rusqlite = { workspace = true }
tempfile = "3.0"
lofty = "0.25.5"
curve-core = { path = "../curve-core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[lints]
workspace = true
