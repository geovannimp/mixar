[package]
name = "backend-cpal"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "CPAL backend for Mixar"
license = "MIT"
repository = "https://github.com/geovannimp/mixar"

[features]
default = ["pipewire"]
pipewire = ["cpal/pipewire"]

[dependencies]
audio-core = { path = "../audio-core" }
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
cpal = { version = "0.18", features = ["realtime"] }
