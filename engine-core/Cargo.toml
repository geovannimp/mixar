[package]
name = "engine-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core engine orchestration for rust-dj-engine"

[features]
default = ["backend-cpal"]
backend-cpal = ["dep:backend-cpal"]

[dependencies]
audio-core = { path = "../audio-core" }
engine-dsp = { path = "../engine-dsp" }
backend-null = { path = "../backend-null" }
backend-miniaudio = { path = "../backend-miniaudio" }
backend-cpal = { path = "../backend-cpal", optional = true }
rtrb = "0.3"
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
log.workspace = true
tokio.workspace = true

[dev-dependencies]
library-core = { path = "../library-core" }
