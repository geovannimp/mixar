[inputs.master]
crossfader = { action = "Mixer::set_crossfader", soft_takeover = true }
cue_mix = { action = "Mixer::set_cue_mix", soft_takeover = true }

[outputs.deck_1]
play_pause = { on = "play_led", off = { type = "note", channel = 1, note = 0x0B, velocity = 0x00 } }
cue = { on = "cue_led", off = { type = "note", channel = 1, note = 0x0C, velocity = 0x00 } }
sync = { on = "sync_led", off = { type = "note", channel = 1, note = 0x58, velocity = 0x00 } }
headphone_cue = { on = "pfl_led", off = { type = "note", channel = 1, note = 0x54, velocity = 0x00 } }
hot_cue_1 = { on = "hot_cue_1_led", off = { type = "note", channel = 8, note = 0x00, velocity = 0x00 } }
hot_cue_2 = { on = "hot_cue_2_led", off = { type = "note", channel = 8, note = 0x01, velocity = 0x00 } }
hot_cue_3 = { on = "hot_cue_3_led", off = { type = "note", channel = 8, note = 0x02, velocity = 0x00 } }
hot_cue_4 = { on = "hot_cue_4_led", off = { type = "note", channel = 8, note = 0x03, velocity = 0x00 } }
hot_cue_5 = { on = "hot_cue_5_led", off = { type = "note", channel = 8, note = 0x04, velocity = 0x00 } }
hot_cue_6 = { on = "hot_cue_6_led", off = { type = "note", channel = 8, note = 0x05, velocity = 0x00 } }
hot_cue_7 = { on = "hot_cue_7_led", off = { type = "note", channel = 8, note = 0x06, velocity = 0x00 } }
hot_cue_8 = { on = "hot_cue_8_led", off = { type = "note", channel = 8, note = 0x07, velocity = 0x00 } }

