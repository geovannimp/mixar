# Pioneer DDJ-400 mapping.
# Each HW pad note bank → named pad leaf (notes already encode mode).
# Mode buttons → pad_mode so the UI follows the hardware page.
# Controllers whose pads keep the same notes across modes should use Deck(_)::pad(n:N).
#
# LEDs are declarative: every `[outputs.*]` entry names the `signal` that drives
# it, so the session re-resolves the whole section on every state change and
# force-refreshes on attach. Bindings with a `blink` target flash while their
# signal is true (used for the +SHIFT mode indicators).

schema_version = 1

[toml-schema]
version = "1.0.0"
location = "../../schemas/map.tosd"

[lifecycle]
on_init = "on_init"
idle_heartbeat = "idle_heartbeat"

[inputs.deck_1]
play_pause = "Deck(_)::toggle_play"
cue = "Deck(_)::cue_default"
sync = "Deck(_)::toggle_sync"
tempo_range = "Deck(_)::cycle_tempo_range"
quantize = "Deck(_)::set_quantize"
headphone_cue = "Deck(_)::set_headphone_cue"
volume = { action = "Deck(_)::set_volume", soft_takeover = true }
gain = { action = "Deck(_)::set_gain", soft_takeover = true }
tempo = { action = "Deck(_)::set_speed", soft_takeover = true, invert = true }
eq_high = { action = "Deck(_)::set_eq_high", soft_takeover = true }
eq_mid = { action = "Deck(_)::set_eq_mid", soft_takeover = true }
