hot_cue_8 = "Deck(_)::trigger_hot_cue_8"
delete_hot_cue_1 = "Deck(_)::delete_hot_cue_1"
delete_hot_cue_2 = "Deck(_)::delete_hot_cue_2"
delete_hot_cue_3 = "Deck(_)::delete_hot_cue_3"
delete_hot_cue_4 = "Deck(_)::delete_hot_cue_4"
delete_hot_cue_5 = "Deck(_)::delete_hot_cue_5"
delete_hot_cue_6 = "Deck(_)::delete_hot_cue_6"
delete_hot_cue_7 = "Deck(_)::delete_hot_cue_7"
delete_hot_cue_8 = "Deck(_)::delete_hot_cue_8"
auto_loop_1 = "Deck(_)::auto_loop_1"
auto_loop_2 = "Deck(_)::auto_loop_2"
auto_loop_4 = "Deck(_)::auto_loop_4"
auto_loop_8 = "Deck(_)::auto_loop_8"
auto_loop_16 = "Deck(_)::auto_loop_16"
auto_loop_32 = "Deck(_)::auto_loop_32"
beat_jump_back_1 = "Deck(_)::beat_jump_back_1"
beat_jump_fwd_1 = "Deck(_)::beat_jump_fwd_1"
beat_jump_back_2 = "Deck(_)::beat_jump_back_2"
beat_jump_fwd_2 = "Deck(_)::beat_jump_fwd_2"
beat_jump_back_4 = "Deck(_)::beat_jump_back_4"
