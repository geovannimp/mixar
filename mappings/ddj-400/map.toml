# Pioneer DDJ-400 mapping.
# All HW pad note banks → Deck(_)::pad(n:N); mode buttons → pad_mode(mode:…).
# Software pad_mode selects hot cue / loop roll / beat jump / sampler.

schema_version = 1

[toml-schema]
version = "1.0.0"
location = "../../schemas/map.tosd"

[lifecycle]
on_init = "on_init"
idle_heartbeat = "idle_heartbeat"
on_shutdown = "on_shutdown"

[inputs.deck_1]
play_pause = "Deck(_)::toggle_play"
cue = "Deck(_)::cue_default"
sync = "Deck(_)::toggle_sync"
quantize = "Deck(_)::set_quantize"
headphone_cue = "Deck(_)::set_headphone_cue"
volume = { action = "Deck(_)::set_volume", soft_takeover = true }
gain = { action = "Deck(_)::set_gain", soft_takeover = true }
tempo = { action = "Deck(_)::set_speed", soft_takeover = true, invert = true }
eq_high = { action = "Deck(_)::set_eq_high", soft_takeover = true }
eq_mid = { action = "Deck(_)::set_eq_mid", soft_takeover = true }
eq_low = { action = "Deck(_)::set_eq_low", soft_takeover = true }
filter = { action = "Deck(_)::set_filter", soft_takeover = true }
jog_touch = "Deck(_)::jog_touch"
jog_touch_shift = "Deck(_)::jog_touch"
jog_turn = "Deck(_)::jog_turn"
jog_side = "Deck(_)::jog_turn"
jog_search = "Deck(_)::jog_turn"
loop_in = "Deck(_)::loop_in"
loop_out = "Deck(_)::loop_out"
exit_loop = "Deck(_)::exit_loop"
pad_mode_hot_cue = "Deck(_)::pad_mode(mode:hot_cue)"
pad_mode_loop_roll = "Deck(_)::pad_mode(mode:loop_roll)"
pad_mode_beat_jump = "Deck(_)::pad_mode(mode:beat_jump)"
pad_mode_sampler = "Deck(_)::pad_mode(mode:sampler)"
hot_cue_1 = "Deck(_)::pad(n:1)"
hot_cue_2 = "Deck(_)::pad(n:2)"
hot_cue_3 = "Deck(_)::pad(n:3)"
hot_cue_4 = "Deck(_)::pad(n:4)"
hot_cue_5 = "Deck(_)::pad(n:5)"
hot_cue_6 = "Deck(_)::pad(n:6)"
hot_cue_7 = "Deck(_)::pad(n:7)"
hot_cue_8 = "Deck(_)::pad(n:8)"
