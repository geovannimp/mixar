delete_hot_cue_2 = "Deck(_)::delete_hot_cue(slot:2)"
delete_hot_cue_3 = "Deck(_)::delete_hot_cue(slot:3)"
delete_hot_cue_4 = "Deck(_)::delete_hot_cue(slot:4)"
