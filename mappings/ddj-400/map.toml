# Pioneer DDJ-400 mapping.
# Each HW pad note bank → named pad leaf (notes already encode mode).
# Mode buttons → pad_mode so the UI follows the hardware page.
# Controllers whose pads keep the same notes across modes should use Deck(_)::pad(n:N).

schema_version = 1

[toml-schema]
version = "1.0.0"
location = "../../schemas/map.tosd"

[lifecycle]
on_init = "on_init"
idle_heartbeat = "idle_heartbeat"
on_shutdown = "on_shutdown"

[inputs.deck_1]
play_pause = "Deck(_)::toggle_play"
cue = "Deck(_)::cue_default"
