pad_mode_loop_roll_led = { type = "note", channel = 1, note = 0x6D, velocity = 0x7F, direction = "out" }

# +SHIFT mode indicators: the unit flashes these while SHIFT is held.
pad_mode_hot_cue_shift_led = { type = "note", channel = 1, note = 0x69, velocity = 0x7F, direction = "out" }
