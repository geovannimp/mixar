# --- Feedback (MIDI-OUT) ---------------------------------------------------------
# Button LED addresses follow the Pioneer MIDI-OUT column; the input notes above
# follow the community input map, so a button can carry a different note in each.

# Loop group: all six lamps track `loop_active` (the unit lights them as a set).
