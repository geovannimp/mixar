[master]
crossfader = { type = "cc14", channel = 7, cc = { msb = 0x1F, lsb = 0x3F } }
cue_mix = { type = "cc14", channel = 7, cc = { msb = 0x0C, lsb = 0x2C } }
# Browse encoder (Mixxx SelectKnob): relative CC ch7 / 0x40
browse = { type = "cc", channel = 7, cc = 0x40, relative = "TWOS_COMPLEMENT" }
# LOAD buttons (Mixxx LoadSelectedTrack): note ch7 / 0x46, 0x47
load_deck_1 = { type = "note", channel = 7, note = 0x46 }
load_deck_2 = { type = "note", channel = 7, note = 0x47 }

# --- Feedback (MIDI-OUT) ---------------------------------------------------------
# MASTER CUE button; the +SHIFT variant is declared but not bound (no engine state).
master_cue_led = { type = "note", channel = 7, note = 0x63, velocity = 0x7F, direction = "out" }
master_cue_shift_led = { type = "note", channel = 7, note = 0x78, velocity = 0x7F, direction = "out" }
# Beat FX ON/OFF (channel 5). Declared for completeness: the engine has no beat FX yet.
