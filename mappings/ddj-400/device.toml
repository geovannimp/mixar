# Pioneer DDJ-400 device definition.
# MIDI from Pioneer MIDI Message List + Mixxx Pioneer-DDJ-400.midi.xml.
# Pad banks use distinct notes per hardware mode; map.toml binds each bank to a named pad leaf.
# Mode buttons still set engine pad_mode so the UI follows the hardware page.
# Ref: https://github.com/mixxxdj/mixxx/blob/main/res/controllers/Pioneer-DDJ-400.midi.xml
# LED / pad-lamp addresses come from the Pioneer MIDI list (MIDI-OUT column):
# https://downloads.support.alphatheta.com/software_info/dj-controllers/DDJ-400/DDJ-400_MIDI_Message_List_E1.pdf

schema_version = 1
id = "pioneer.ddj-400"
vendor_name = "Pioneer"
product_name = "DDJ-400"
usb_vid = 0x2b73
usb_pid = 0x0026
midi_name_contains = ["DDJ-400"]

[toml-schema]
version = "1.0.0"
location = "../../schemas/device.tosd"

[audio]
output_name_contains = ["DDJ-400"]

