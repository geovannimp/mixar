# Let mise read the standard pins (.node-version, rust-toolchain.toml).
# Idiomatic version files are off by default in recent mise.
[settings]
idiomatic_version_file_enable_tools = ["node", "rust"]

[tools]
# 3.50.1 is the first release with the Linux compositor fix (#196083): on
# NVIDIA, where can_blit is false, 3.50.0 offset every layer by half the window
# (flutter/flutter#195885).
flutter = { version = "3.50.1", postinstall = "dart pub global activate dashmonx" }
ninja = "1.13.2"
# Rust compiler cache (rustc-wrapper in .cargo/config.toml). Installed from the
# GitHub release archive so the `kache` front-end and its `kache-engine`
# companion stay side by side. Do NOT run `kache init`: it edits developer-global
# config and installs unrelated shims/services.
"github:kunobi-ninja/kache" = "2.1.1"
"npm:@colbymchenry/codegraph" = "latest"
# Desktop control for agents (AX/AT-SPI tree + refs, no pixels). See AGENTS.md.
# allow_builds runs the package postinstall, which links the native binary.
"npm:agent-desktop" = { version = "1.2.0", allow_builds = ["agent-desktop"] }

# dart pub global binaries (e.g. dashmonx from flutter postinstall)
[env]
_.path = ["~/.pub-cache/bin"]
# Single source of truth for kache's shims path; cargokit reads this variable.
KACHE_SHIMS_DIR = "${HOME}/.local/lib/kache/shims"

# One-time per machine (Unix): compiler shims plus cache settings. The shims
# only create links in kache's own directory; they do not touch global Cargo
# config or install services (that is what plain `kache init` would do).
# Cargokit puts this directory on PATH for the cargo build only: a global PATH
# entry makes Flutter's build hooks resolve `clang` to the shim and fail.
[tasks.kache-setup]
description = "Install kache compiler shims and tune the local cache"
run = """
if command -v kache >/dev/null 2>&1; then
  kache init --shims "$KACHE_SHIMS_DIR" --force
  if [ -z "${CI:-}" ]; then
    kache config set cache.explain_miss true --global
    kache config set cache.local_max_size 50GiB --global
  fi
fi
"""
run_windows = "echo kache-setup skipped on Windows"

# `mise install` runs the task above. Failures only warn, so a machine without
# kache (or a Windows host) still completes the install.
[hooks]
postinstall = { task = "kache-setup" }
