# Git hooks via lefthook (https://lefthook.dev).
# Installed by `npm install` at the repo root (`prepare` → `lefthook install`).
# Pre-commit runs format:staged / lint:staged for affected projects
# (add format-files / lint-files task ids in the app moon.yml — do not edit this hook).
# CI keeps full-package :lint / :format-check via moon.
# Skip a job: LEFTHOOK_EXCLUDE=format,lint git commit ...
# Disable all hooks: LEFTHOOK=0 git commit ...
# Emergency bypass: git commit --no-verify

pre-commit:
  commands:
    format:
      run: npm run format:staged
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx}"
      run: npm run lint:staged
      stage_fixed: true
