[package]
name = "gui-app"
version = "0.1.0"
description = "Rust DJ Engine prototype"
authors = ["you"]
edition = "2021"

[lib]
name = "gui_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.10"
engine-core = { path = "../../engine-core", features = ["backend-cpal"] }
library-core = { path = "../../library-core" }
