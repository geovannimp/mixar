# https://pub.dev/packages/icons_launcher
# Regenerate: moon run gui-flutter:icons  (or: dart run icons_launcher:create)
# Sources: pack masters — 1024 app mark + Android adaptive layers.
icons_launcher:
  image_path: "assets/mixar-icon.png"
  platforms:
    android:
      enable: true
      image_path: "assets/mixar-icon.png"
      adaptive_background_image: "assets/mixar-icon-background.png"
      adaptive_foreground_image: "assets/mixar-icon-foreground.png"
      adaptive_round_image: "assets/mixar-icon.png"
    macos:
      enable: true
      image_path: "assets/mixar-icon.png"
    windows:
      enable: true
      image_path: "assets/mixar-icon.png"
    web:
      enable: true
      image_path: "assets/mixar-icon.png"
      maskable_image_path: "assets/mixar-icon.png"
      favicon_path: "assets/mixar-icon.png"
    # Snap packaging only — enable when shipping a .snap.
    linux:
      enable: false
    ios:
      enable: false
