# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:very_good_analysis/analysis_options.yaml

# Riverpod-aware lints (https://pub.dev/packages/riverpod_lint).
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - rust_builder/**
    - lib/src/rust/**

linter:
  # Override rules from very_good_analysis here as needed.
  # Suppress at line/file with // ignore: rule_name or // ignore_for_file: rule_name.
  rules:
    # App package: skip public API docs noise.
    public_member_api_docs: false
    # Riverpod Notifiers mutate via methods (`void set` → `state =`); VGA's
    # setter preference fights that and riverpod_lint's
    # avoid_public_notifier_properties.
    use_setters_to_change_properties: false
