# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:very_good_analysis/analysis_options.yaml

# Analyzer plugins (https://dart.dev/tools/analyzer-plugins).
plugins:
  # Riverpod-aware lints (https://pub.dev/packages/riverpod_lint).
  riverpod_lint: ^3.1.9
  # Local one-public-widget-per-file rule (packages/gui_flutter_lints).
  gui_flutter_lints:
    path: ../../packages/gui_flutter_lints

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - rust_builder/**
    - lib/src/rust/**
  errors:
    # Unnamed constructors are declared as `new` so a class rename touches one
    # line instead of every constructor. very_good_analysis ships
    # `unnecessary_type_name_in_constructor` as an info, and the lint task runs
    # with --no-fatal-infos, so promote it to warning to make it enforced.
    unnecessary_type_name_in_constructor: warning

linter:
  # Override rules from very_good_analysis here as needed.
  # Suppress at line/file with // ignore: rule_name or
  # // ignore_for_file: rule_name.
  rules:
    # App package: skip public API docs noise.
    public_member_api_docs: false
    # Riverpod Notifiers mutate via methods (`void set` → `state =`); VGA's
    # setter preference fights that and riverpod_lint's
    # avoid_public_notifier_properties.
    use_setters_to_change_properties: false
    # Explicit local types are load-bearing in a few switches: `dart fix`
    # applied this rule to libraryTableTracksProvider and degraded its
    # three-arm AsyncValue switch to Object/dynamic (an `AsyncData([])` arm
    # has no type to infer from), so the quickfix broke compilation twice
    # with `whenData` undefined and argument_type_not_assignable.
    # Inference-sensitive code keeps its annotation on purpose.
    omit_local_variable_types: false
    # Forces explicit types onto public Riverpod declarations, which means
    # naming ProviderFamily / NotifierProviderFamily. Those are only reachable
    # via package:riverpod/src/..., so the rule manufactures
    # `implementation_imports` + `depend_on_referenced_packages` diagnostics,
    # and `dart fix` answers those by adding an unpinned `riverpod: any`
    # dependency. Not worth 22 annotations on provider declarations.
    specify_nonobvious_property_types: false
