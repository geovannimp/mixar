// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.host_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.host_flutter'
    }

    // Must be >= the app's compileSdk: AndroidX dependencies pulled in by
    // Flutter's embedding (and file_picker) declare AAR metadata requiring 34+.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 19
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../../../crates/host-flutter"
    libname = "host_flutter"
    // Android loads Microsoft's ONNX Runtime AAR at runtime and runs every stem
    // job on the CPU EP (accelerators measured slower), so the desktop-only
    // `stems-webgpu` feature stays off.
    cargoFlags = ["--no-default-features", "--features", "stems"]
}
