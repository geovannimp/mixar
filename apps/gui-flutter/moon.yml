$schema: "https://moonrepo.dev/schemas/project.json"
language: "other"
layer: "application"
stack: "frontend"
id: "gui-flutter"

workspace:
  inheritedTasks:
    include: []

toolchains:
  default: "system"

fileGroups:
  sources:
    - "lib/**/*"
    - "pubspec.yaml"
    - "pubspec.lock"
    - "analysis_options.yaml"
    - "flutter_rust_bridge.yaml"
    - "linux/**/*"
    - "macos/**/*"
    - "windows/**/*"
    - "web/**/*"
  rustBuilder:
    - "rust_builder/**/*"
    - "/crates/host-flutter/**/*"

tasks:
  # Linux-only for now (macOS/Windows/web enabled in Flutter but unverified).
  # Uses repo mise.toml Flutter pin (not a system install).
  # dashmonx: activated by flutter postinstall in mise.toml; hot-reloads on lib/ changes.
  dev-linux:
    command: "mise"
    args: ["exec", "--", "dashmonx", "-d", "linux"]
    toolchain: "system"
    preset: "server"
    inputs:
      - "@group(sources)"
      - "@group(rustBuilder)"

  build-linux:
    command: "mise"
    args: ["exec", "--", "flutter", "build", "linux", "--debug"]
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "@group(rustBuilder)"
    options:
      runInCI: false

  analyze:
    command: "mise"
    args: ["exec", "--", "flutter", "analyze"]
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "analysis_options.yaml"
    options:
      runInCI: true

  format-check:
    command: "bash"
    args:
      - "-c"
      - "mise exec -- flutter pub get && mise exec -- dart format --set-exit-if-changed lib test integration_test"
    toolchain: "system"
    inputs:
      - "@group(sources)"
    options:
      runInCI: true

  # Pre-commit only (lefthook → moon --affected --status staged).
  # Inputs are .dart-only so this task is skipped when no Dart sources are staged.
  # `pass: false` runs full `dart format` on app sources whenever any `.dart` is staged
  # (same scope as format-check; excludes vendored rust_builder).
  # `flutter pub get` first so analysis_options resolves before format (matches CI).
  # Unset GIT_* so Flutter's version probe doesn't inherit the hook's repo and report 0.0.0-unknown.
  format-files:
    command: "bash"
    args:
      - "-c"
      - "unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_PREFIX; mise exec -- flutter pub get && mise exec -- dart format lib test integration_test"
    toolchain: "system"
    inputs:
      - "**/*.dart"
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: false
        filter:
          - "**/*.dart"
        passDotWhenNoResults: false

  # Pre-commit only (lefthook → moon --affected --status staged).
  # Same analyze as CI `analyze`. `pass: false` so flutter does not get file path args;
  # `passDotWhenNoResults: false` skips when no `.dart` is staged.
  lint-files:
    command: "bash"
    args:
      - "-c"
      - "unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_PREFIX; mise exec -- flutter analyze"
    toolchain: "system"
    inputs:
      - "**/*.dart"
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: false
        filter:
          - "**/*.dart"
        passDotWhenNoResults: false

  test:
    command: "mise"
    args: ["exec", "--", "flutter", "test"]
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "test/**/*"
    options:
      runInCI: true

  generate:
    command: "bash"
    args:
      - "-c"
      - 'export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"; flutter_rust_bridge_codegen generate'
    toolchain: "system"
    inputs:
      - "@group(rustBuilder)"
      - "flutter_rust_bridge.yaml"
    options:
      cache: false
      runInCI: false
