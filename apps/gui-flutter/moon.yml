$schema: "https://moonrepo.dev/schemas/project.json"
language: "other"
layer: "application"
stack: "frontend"
id: "gui-flutter"

workspace:
  inheritedTasks:
    include: []

toolchains:
  default: "system"

fileGroups:
  sources:
    - "lib/**/*"
    - "pubspec.yaml"
    - "pubspec.lock"
    - "analysis_options.yaml"
    - "flutter_rust_bridge.yaml"
    - "linux/**/*"
    - "macos/**/*"
    - "windows/**/*"
    - "web/**/*"
    - "android/**/*"
  rustBuilder:
    - "rust_builder/**/*"
    - "/crates/host-flutter/**/*"

tasks:
  # Linux-only for now (macOS/Windows/web enabled in Flutter but unverified).
  # Uses repo mise.toml Flutter pin (not a system install).
  # dashmonx: activated by flutter postinstall in mise.toml; hot-reloads on lib/ changes.
  # --no-enable-impeller: Impeller misrenders on Linux. Passed through to
  # `flutter run`, which turns it into the enable-impeller=false engine switch.
  # Built bundles get the same opt-out from linux/runner/my_application.cc.
  dev-linux:
    command: "mise"
    args: ["exec", "--", "dashmonx", "-d", "linux", "--no-enable-impeller"]
    toolchain: "system"
    preset: "server"
    inputs:
      - "@group(sources)"
      - "@group(rustBuilder)"

  # Impeller is disabled for built bundles in linux/runner/my_application.cc
  # (`flutter build linux` has no --no-enable-impeller flag).
  build-linux:
    command: "mise"
    args: ["exec", "--", "flutter", "build", "linux", "--debug"]
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "@group(rustBuilder)"
    options:
      runInCI: false

  build-linux-release:
    command: "mise"
    args: ["exec", "--", "flutter", "build", "linux", "--release"]
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "@group(rustBuilder)"
    options:
      runInCI: false

  # Local installer smoke tests (host OS must match).
  # Requires: fastforge (+ appimagetool on Linux / appdmg on macOS / Inno Setup on Windows).
  # Linux: .appimageignore excludes bundled libasound/libpipewire (system audio stack).
  package-linux:
    command: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_PREFIX
        mise exec -- dart pub global activate fastforge
        export PATH="${HOME}/.pub-cache/bin:${PATH}"
        mise exec -- bash -c 'export PATH="${HOME}/.pub-cache/bin:${PATH}"; exec fastforge package --platform linux --targets appimage'
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "@group(rustBuilder)"
      - "distribute_options.yaml"
      - "linux/packaging/**/*"
      - ".appimageignore"
    options:
      runInCI: false
      cache: false

  package-macos:
    command: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_PREFIX
        mise exec -- dart pub global activate fastforge
        export PATH="${HOME}/.pub-cache/bin:${PATH}"
        mise exec -- bash -c 'export PATH="${HOME}/.pub-cache/bin:${PATH}"; exec fastforge package --platform macos --targets dmg'
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "@group(rustBuilder)"
      - "distribute_options.yaml"
      - "macos/packaging/**/*"
    options:
      runInCI: false
      cache: false

  package-windows:
    command: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_PREFIX
        mise exec -- dart pub global activate fastforge
        export PATH="${HOME}/.pub-cache/bin:${LOCALAPPDATA:+$LOCALAPPDATA/Pub/Cache/bin:}${PATH}"
        mise exec -- bash -c 'export PATH="${HOME}/.pub-cache/bin:${LOCALAPPDATA:+$LOCALAPPDATA/Pub/Cache/bin:}${PATH}"; exec fastforge package --platform windows --targets exe'
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "@group(rustBuilder)"
      - "distribute_options.yaml"
      - "windows/packaging/**/*"
    options:
      runInCI: false
      cache: false

  # Regenerate launcher icons from assets/mixar-icon*.png
  icons:
    command: "bash"
    args:
      - "-c"
      - "unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_PREFIX; mise exec -- dart run icons_launcher:create"
    toolchain: "system"
    inputs:
      - "assets/mixar-icon.png"
      - "assets/mixar-icon-foreground.png"
      - "assets/mixar-icon-background.png"
      - "icons_launcher.yaml"
      - "pubspec.yaml"
    options:
      runInCI: false
      cache: false

  # Static analysis. Named `lint` (not `analyze`) so the root `:lint` task
  # picks it up — `npm run lint` in CI runs this via `moon run :lint`.
  # `flutter analyze` is Flutter's linter; `--no-fatal-infos` keeps lint
  # suggestions non-fatal, while warnings and errors still fail the task.
  lint:
    command: "mise"
    args: ["exec", "--", "flutter", "analyze", "--no-fatal-infos"]
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "analysis_options.yaml"
    options:
      runInCI: true

  format-check:
    command: "bash"
    args:
      - "-c"
      - "mise exec -- flutter pub get && mise exec -- dart format --set-exit-if-changed lib test integration_test"
    toolchain: "system"
    inputs:
      - "@group(sources)"
    options:
      runInCI: true

  # Pre-commit only (lefthook → moon --affected --status staged).
  # Inputs are .dart-only so this task is skipped when no Dart sources are staged.
  # `pass: false` runs full `dart format` on app sources whenever any `.dart` is staged
  # (same scope as format-check; excludes vendored rust_builder).
  # `flutter pub get` first so analysis_options resolves before format (matches CI).
  # Unset GIT_* so Flutter's version probe doesn't inherit the hook's repo and report 0.0.0-unknown.
  format-files:
    command: "bash"
    args:
      - "-c"
      - "unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_PREFIX; mise exec -- flutter pub get && mise exec -- dart format lib test integration_test"
    toolchain: "system"
    inputs:
      - "**/*.dart"
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: false
        filter:
          - "**/*.dart"
        passDotWhenNoResults: false

  # Pre-commit only (lefthook → moon --affected --status staged).
  # Same analyzer as CI `lint`. `pass: false` so flutter does not get file path args;
  # `passDotWhenNoResults: false` skips when no `.dart` is staged.
  lint-files:
    command: "bash"
    args:
      - "-c"
      - "unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_PREFIX; mise exec -- flutter analyze --no-fatal-infos"
    toolchain: "system"
    inputs:
      - "**/*.dart"
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: false
        filter:
          - "**/*.dart"
        passDotWhenNoResults: false

  # Concurrency: `-j <cpus>` instead of package:test's default cores/2, because the
  # per-suite kernel compiles serialize regardless, so the extra concurrency shortens
  # only the body phase. Measured 4-core A/B: 48.3s/48.0s (-j 2) -> 34.7s (-j 4); wash
  # on 16 cores. The wrapper also forwards moon's `-- <args>` passthrough and unsets
  # GIT_* — see scripts/flutter_test.sh for why each is needed.
  test:
    command: "bash"
    args: ["scripts/flutter_test.sh"]
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "test/**/*"
      - "scripts/flutter_test.sh"
    options:
      runInCI: true

  # Developer fast path: runs only the suites that transitively import the
  # changed files (branch diff vs the default branch + staged/unstaged/untracked
  # changes). Only pubspec.{yaml,lock} force the full suite; every other input is
  # resolved through the import graph — see scripts/test_impacted.dart.
  #
  # CI must keep using `:test` (the full suite) above, never this task. Its
  # runInCI stays true so CI's `moon ci` never picks it up; moon 2.6.2 can
  # resolve a runInCI:false task without --affected, so the flag is a CI-scope
  # choice now, not a moon limitation.
  test-affected:
    command: "bash"
    args:
      - "-c"
      - 'exec mise exec -- dart run scripts/test_impacted.dart --run'
    toolchain: "system"
    inputs:
      - "@group(sources)"
      - "test/**/*"
      - "scripts/test_impacted.dart"
    options:
      cache: false
      runInCI: true

  generate:
    command: "bash"
    args: ["scripts/ensure-frb-codegen.sh"]
    toolchain: "system"
    inputs:
      - "@group(rustBuilder)"
      - "flutter_rust_bridge.yaml"
      - "scripts/ensure-frb-codegen.sh"
    options:
      cache: false
      runInCI: false
