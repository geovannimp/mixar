$schema: "https://moonrepo.dev/schemas/project.json"
language: "javascript"
layer: "application"
stack: "frontend"
id: "website"

workspace:
  inheritedTasks:
    include: []

toolchains:
  default: "node"

fileGroups:
  sources:
    - "src/**/*"
    - "public/**/*"
    - "astro.config.mjs"
    - "package.json"
  # Both the test and lint tasks are sensitive to both config files.
  configs:
    - "tsconfig.json"
    - "vitest.config.ts"

tasks:
  dev:
    command: "npm"
    args: ["run", "dev"]
    toolchain: "node"
    preset: "server"
    inputs:
      - "@group(sources)"

  build:
    command: "npm"
    args: ["run", "build"]
    toolchain: "node"
    inputs:
      - "@group(sources)"
    outputs:
      - "dist"

  preview:
    command: "npm"
    args: ["run", "preview"]
    toolchain: "node"
    preset: "server"
    deps:
      - "build"
    inputs:
      - "@group(sources)"
      - "dist/**/*"

  test:
    command: "npm"
    args: ["run", "test"]
    toolchain: "node"
    inputs:
      - "@group(sources)"
      - "@group(configs)"
    options:
      runInCI: true

  # A type check, not a linter, and named for what it does — the website has no
  # ESLint/format step, and calling this `lint` would report lint coverage that
  # does not exist. .github/workflows/lint.yml invokes it explicitly by name,
  # because no workflow runs `moon ci`, so runInCI alone would not schedule it.
  #
  # Vite strips types without checking them, so without this a type error in
  # src/scripts would only surface at runtime.
  typecheck:
    command: "npm"
    args: ["run", "check"]
    toolchain: "node"
    inputs:
      - "@group(sources)"
      - "@group(configs)"
    options:
      runInCI: true
