$schema: "https://moonrepo.dev/schemas/project.json"
language: "javascript"
layer: "application"
stack: "frontend"
id: "website"

workspace:
  inheritedTasks:
    include: []

toolchains:
  default: "node"

fileGroups:
  sources:
    - "src/**/*"
    - "public/**/*"
    - "astro.config.mjs"
    - "package.json"
  # Both the test and lint tasks are sensitive to both config files.
  configs:
    - "tsconfig.json"
    - "vitest.config.ts"

tasks:
  dev:
    command: "npm"
    args: ["run", "dev"]
    toolchain: "node"
    preset: "server"
    inputs:
      - "@group(sources)"

  build:
    command: "npm"
    args: ["run", "build"]
    toolchain: "node"
    inputs:
      - "@group(sources)"
    outputs:
      - "dist"

  preview:
    command: "npm"
    args: ["run", "preview"]
    toolchain: "node"
    preset: "server"
    deps:
      - "build"
    inputs:
      - "@group(sources)"
      - "dist/**/*"

  test:
    command: "npm"
    args: ["run", "test"]
    toolchain: "node"
    inputs:
      - "@group(sources)"
      - "@group(configs)"

  # Named `lint` so it joins the existing pipeline: root `npm run lint` is
  # `moon run :lint`, which .github/workflows/lint.yml runs, and `moon ci` picks
  # it up. The website opts out of inherited tasks, so without a task here this
  # would be config nothing ever calls.
  #
  # Vite strips types without checking them, so without this a type error in
  # src/scripts would only surface at runtime.
  lint:
    command: "npm"
    args: ["run", "check"]
    toolchain: "node"
    inputs:
      - "@group(sources)"
      - "@group(configs)"
