$schema: "https://moonrepo.dev/schemas/project.json"
language: "javascript"
layer: "application"
stack: "frontend"
id: "website"

workspace:
  inheritedTasks:
    include: []

toolchains:
  default: "node"

fileGroups:
  sources:
    - "src/**/*"
    - "public/**/*"
    - "astro.config.mjs"
    - "package.json"
  # Both the test and lint tasks are sensitive to both config files.
  configs:
    - "tsconfig.json"
    - "vitest.config.ts"

tasks:
  dev:
    command: "npm"
    args: ["run", "dev"]
    toolchain: "node"
    preset: "server"
    inputs:
      - "@group(sources)"

  build:
    command: "npm"
    args: ["run", "build"]
    toolchain: "node"
    inputs:
      - "@group(sources)"
    outputs:
      - "dist"

  preview:
    command: "npm"
    args: ["run", "preview"]
    toolchain: "node"
    preset: "server"
    deps:
      - "build"
    inputs:
      - "@group(sources)"
      - "dist/**/*"

  test:
    command: "npm"
    args: ["run", "test"]
    toolchain: "node"
    inputs:
      - "@group(sources)"
      - "@group(configs)"
    options:
      runInCI: true

  # A type check, not a linter, and named for what it does — the website has no
  # ESLint/format step, and calling this `lint` would report lint coverage that
  # does not exist. .github/workflows/lint.yml invokes it explicitly by name,
  # because no workflow runs `moon ci`, so runInCI alone would not schedule it.
  #
  # Vite strips types without checking them, so without this a type error in
  # src/scripts would only surface at runtime.
  typecheck:
    command: "npm"
    args: ["run", "check"]
    toolchain: "node"
    inputs:
      - "@group(sources)"
      - "@group(configs)"
    options:
      runInCI: true

  # npm security audit, run by .github/workflows/audit.yml alongside `cargo audit`.
  #
  # Scoped to the whole npm dependency tree even though it lives on the website
  # project: npm workspaces are hoisted, so there is one root package-lock.json
  # and `npm audit` run from here reads it (verified — it does not need
  # node_modules installed, and correctly fails against a poisoned lockfile).
  # Website is simply the only project with npm deps today; move this task to
  # whichever project owns package.json if the JS layout changes.
  #
  # `cache: false` — the result depends on the registry's advisory database, not
  # just on inputs, so caching would pin a stale "0 vulnerabilities".
  #
  # Inputs are the whole audited surface: the root package.json holds the
  # `workspaces` globs and the root devDependencies, so a change to it or to a
  # sibling workspace's package.json affects the audit just as much as this
  # project's does. Keeping them accurate matters if this task ever runs under
  # `--affected`.
  audit:
    command: "npm"
    args: ["audit", "--audit-level=high"]
    toolchain: "node"
    inputs:
      - "package.json"
      - "/package.json"
      - "/package-lock.json"
    options:
      cache: false
      runInCI: false
