[package]
name = "gui-app"
version = "0.1.0"
description = "Rust DJ Engine prototype"
authors = ["you"]
edition = "2021"

[lib]
name = "gui_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
base64 = "0.22"
anyhow = "1"
log = "0.4"
audio-core = { path = "../../../crates/audio-core" }
engine-api = { path = "../../../crates/engine-api" }
engine-core = { path = "../../../crates/engine-core", features = ["backend-cpal"] }
library-api = { path = "../../../crates/library-api" }
library-core = { path = "../../../crates/library-core" }
library = { path = "../../../crates/library", features = ["analysis"] }
resampler = { path = "../../../crates/resampler" }
