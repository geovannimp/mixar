$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "application"
id: "gui-app"

workspace:
  inheritedTasks:
    include: []

fileGroups:
  sources:
    - "src/**/*"
    - "index.html"
    - "vite.config.*"
    - "tsconfig*.json"
    - "package.json"
    - ".oxlintrc.json"
    - ".oxfmtrc.json"
    - "components.json"

tasks:
  lint:
    command: "npm"
    args: ["run", "lint"]
    inputs:
      - "@group(sources)"
    options:
      runInCI: true

  format-check:
    command: "npm"
    args: ["run", "format:check"]
    inputs:
      - "@group(sources)"
    options:
      runInCI: true

  # Pre-commit only (lefthook → moon --affected --status staged). New apps
  # should define the same task ids; CI keeps using lint / format-check above.
  format-files:
    command: "npm"
    args: ["run", "format", "--"]
    inputs:
      - "**/*.{ts,tsx}"
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: "args"
        filter:
          - "**/*.{ts,tsx}"
        passDotWhenNoResults: false

  lint-files:
    command: "npm"
    args: ["run", "lint:fix", "--"]
    inputs:
      - "**/*.{ts,tsx}"
    options:
      cache: false
      runInCI: false
      affectedFiles:
        pass: "args"
        filter:
          - "**/*.{ts,tsx}"
        passDotWhenNoResults: false

  build:
    command: "npm"
    args: ["run", "build"]
    inputs:
      - "@group(sources)"
    options:
      runInCI: true

  dev:
    command: "npm"
    args: ["run", "tauri:dev"]
    preset: "server"

  tauri:
    command: "npm"
    args: ["run", "tauri"]
    preset: "server"
