name: Cursor Code Review

# AI PR review via the in-repo composite action (.github/actions/cursor-code-review)
# using @cursor/sdk (local) + CodeGraph MCP. Runs side-by-side with OpenCodeReview
# (.github/workflows/code-review.yml). Marker namespace: <!-- cursor-code-review -->.
# Reply mode may additively comment on OCR threads (add_value) without resolving them.
#
# Setup (once), under Settings -> Secrets and variables -> Actions:
#   secret CURSOR_API_KEY
#
# Triggers:
#   - pull_request_target: opened / synchronize / reopened / ready_for_review → review
#   - pull_request_review_comment created → reply (all authors; intent classifier gates writes)
#   - issue_comment /cursor-review or @cursor-review (MEMBER|OWNER|COLLABORATOR; bots if addressed) → review
#   - workflow_dispatch with pr_number → review
#
# Checkout: base first, then detach to PR head SHA for read-only indexing/review.
# Never run repo npm/moon/lefthook on the PR tree.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Separate concurrency from OCR (ocr-{pr}) so bots never cancel each other.
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || github.event_name == 'workflow_dispatch'
        || github.event_name == 'pull_request_review_comment'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
            || github.event.comment.user.type == 'Bot'
          )
          && (
            contains(github.event.comment.body, '/cursor-review')
            || contains(github.event.comment.body, '@cursor-review')
          )
        )
      )
      && format('cursor-cr-{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr_number)
      || format('cursor-cr-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  cursor-code-review:
    name: cursor-code-review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      github.event_name == 'pull_request_target'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request_review_comment'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
          || (
            github.event.comment.user.type == 'Bot'
            && (
              contains(github.event.comment.body, '/cursor-review')
              || contains(github.event.comment.body, '@cursor-review')
            )
          )
        )
        && (
          startsWith(github.event.comment.body, '/cursor-review')
          || startsWith(github.event.comment.body, '@cursor-review')
          || contains(github.event.comment.body, '/cursor-review')
          || contains(github.event.comment.body, '@cursor-review')
        )
      )
    steps:
      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "::error::CURSOR_API_KEY secret is missing"
            exit 1
          fi

      - name: Resolve PR context
        id: pr-context
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            let prNumber;
            if (eventName === 'workflow_dispatch') {
              prNumber = Number(context.payload.inputs.pr_number);
            } else if (eventName === 'issue_comment') {
              prNumber = context.issue.number;
            } else if (eventName === 'pull_request_review_comment') {
              prNumber = context.payload.pull_request.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed(`pr_number must be a positive integer, got: ${prNumber}`);
              return;
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('title', pullRequest.title);
            const mode =
              eventName === 'pull_request_review_comment' &&
              !(
                (context.payload.comment.body || '').startsWith('/cursor-review') ||
                (context.payload.comment.body || '').startsWith('@cursor-review')
              )
                ? 'reply'
                : 'review';
            core.setOutput('mode', mode);

      # Trusted base checkout keeps .github/actions/cursor-code-review from the
      # base branch. PR head is checked out into pr-head/ for read-only review
      # (CodeGraph index + file reads). Never npm/moon/lefthook on pr-head.
      - name: Checkout base (trusted action + workflow)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-context.outputs.base_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout PR head (read-only tree)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-context.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 1
          path: pr-head

      - name: Verify PR head checkout
        env:
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_SHA}" ] || [ ! -d pr-head ]; then
            echo "::error::Failed to materialize PR head ${HEAD_SHA}"
            exit 1
          fi
          got="$(git -C pr-head rev-parse HEAD)"
          echo "PR head tree at pr-head/ (${got})"
          if [ "${got}" != "${HEAD_SHA}" ]; then
            echo "::error::HEAD mismatch: expected ${HEAD_SHA}, got ${got}"
            exit 1
          fi

      - name: Cursor Code Review
        uses: ./.github/actions/cursor-code-review
        with:
          cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: ${{ steps.pr-context.outputs.mode }}
          pr_number: ${{ steps.pr-context.outputs.pr_number }}
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          working_directory: pr-head
