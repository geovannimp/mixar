name: Audit

# Hybrid policy (#74): fail on vulnerabilities; warnings (unmaintained /
# unsound / yanked) are informational. Prefer bumping deps; add
# crates/.cargo/audit.toml with ignore entries only when a bump is not feasible.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit

  # npm audit for the JS toolchain (website / npm workspaces), matching the
  # cargo job's fail-on-vulnerability policy. Runs via moon so a new npm project
  # is covered by adding the task, without editing this workflow.
  #
  # `--audit-level=high` (set in the website moon task) fails the job on high and
  # critical advisories; moderate/low stay informational, mirroring how
  # cargo-audit treats warnings.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth 0 + MOON_BASE, same as build/lint/test: moon resolves its
      # defaultBranch (`main`) from git history when building the project graph,
      # and fails on a shallow PR checkout with "ambiguous argument 'main'".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup moon affected
        uses: ./.github/actions/setup-moon-base

      - name: Setup toolchains
        uses: ./.github/actions/setup-toolchains

      # `--ignore-scripts` so a pull_request run never executes install scripts:
      # PR-controlled package.json can add one, and on a branch inside this repo
      # the token is not fork-exempt. This still populates
      # node_modules/.bin/moon, which the task runner below needs.
      #
      # `npm audit` itself only reads the committed package-lock.json, so the
      # audit result does not depend on any of this being installed.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # `--no-install` keeps this pinned to the version in devDependencies; bare
      # `npx moon` fails here (the package is published as @moonrepo/cli) and
      # would otherwise fall back to an unpinned registry download.
      - name: Run security audit
        run: npx --no-install moon run website:audit
