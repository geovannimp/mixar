name: Audit

# Hybrid policy (#74): fail on vulnerabilities; warnings (unmaintained /
# unsound / yanked) are informational. Prefer bumping deps; add
# crates/audit.toml with ignore entries only when a bump is not feasible.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit
