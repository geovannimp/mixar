name: Rust beta audit

on:
  schedule:
    # Daily 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  beta:
    name: beta fmt/clippy/test
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: beta
          components: rustfmt, clippy

      - name: Install native deps
        uses: ./.github/actions/install-native-deps

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          shared-key: beta
          cache-on-failure: true

      # Standalone job (no setup-toolchains action), so it invokes the same
      # install-nextest action — keeps the tool/version in one place.
      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Both run regardless of the other's outcome: `&&` would skip the doctest
      # whenever nextest fails, hiding doctest breakage exactly when the suite
      # is already red — and contradicting the "surface the full failure list"
      # intent of .config/nextest.toml. Default shell is `bash -e`, so the exit
      # codes have to be captured explicitly.
      - name: Run tests
        run: |
          cargo nextest run --workspace; nextest_rc=$?
          cargo test --doc; doctest_rc=$?
          echo "nextest_rc=$nextest_rc doctest_rc=$doctest_rc"
          [ "$nextest_rc" -eq 0 ] && [ "$doctest_rc" -eq 0 ]
