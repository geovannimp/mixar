name: OpenCodeReview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege default: only the `review` job below widens `contents` to
# write, because resolveReviewThread is gated on repository write access.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `contents: write`, not `read`: GitHub gates resolveReviewThread on
      # repository write access, so pull-requests: write alone makes
      # resolve_outdated fail with FORBIDDEN. The job still never executes PR
      # code — it checks out the base sha and fetches the head as git objects
      # (persist-credentials: false), so the token only unlocks thread cleanup.
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Install OCR and CodeGraph
        env:
          OCR_VERSION: '1.13.2'
          CODEGRAPH_VERSION: '1.6.2'
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts "@alibaba-group/open-code-review@${OCR_VERSION}" "@colbymchenry/codegraph@${CODEGRAPH_VERSION}"

      - name: Index trusted base for CodeGraph
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CODEGRAPH_NO_DOWNLOAD: '1'
        run: |
          # OCR's checkout cleans the workspace; keep the CodeGraph index outside it.
          if ! git worktree add --detach /tmp/codegraph-trusted-base "$BASE_SHA" ||
             ! codegraph init -y /tmp/codegraph-trusted-base; then
            echo "::warning::CodeGraph initialization failed; continuing review without indexed structural context."
          fi

      - name: Configure CodeGraph MCP
        run: |
          ocr config set mcp_servers.codegraph.command codegraph
          ocr config set mcp_servers.codegraph.args '["serve","--mcp","--path","/tmp/codegraph-trusted-base"]'
          ocr config set mcp_servers.codegraph.tools '["codegraph_explore"]'

      - name: Run OpenCodeReview with inline comments
        uses: alibaba/open-code-review@55450a95e5999dfd00ec2d582c23d76e269922fb # v1.13.2
        with:
          llm_url: ${{ vars.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_protocol: openai
          rule: .opencodereview/rule.json
          background: Review the pull request diff against trusted base rules. Use CodeGraph for structural context.
          github_token: ${{ github.token }}
          # Non-destructive dedupe: a new inline comment whose (path, line range)
          # already overlaps an existing bot review comment is skipped, so a
          # follow-up push does not re-post a finding that is already on the PR.
          incremental: 'true'
          # Close the action's own threads that GitHub already marked outdated
          # (their original lines no longer exist in the diff). Threads with a
          # human reply, already-resolved threads, and threads a finding from
          # this run still covers are never touched.
          resolve_outdated: 'true'
