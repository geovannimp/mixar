name: Website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/pages.yml"
      - "package-lock.json"
  pull_request:
    paths:
      - "apps/website/**"
      - ".github/workflows/pages.yml"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEFTHOOK: "0"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build via the workspace script (astro), not `moon run`, so a shallow
      # PR checkout does not trip moon's defaultBranch (`main`) VCS lookup.
      #
      # The PostHog token is public and write-only, but it lives in a secret so
      # it can be rotated without a code change. Fork PRs get no secrets, which
      # leaves the key empty and analytics disabled for those builds.
      - name: Build website
        run: npm run build -w website
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          # Source map upload for error tracking needs a *personal* API key
          # (phx_), which the public project token cannot provide. Both of
          # these are absent on fork PRs, so the upload step is skipped there
          # and the site simply ships with minified stack traces.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: https://eu.posthog.com

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
