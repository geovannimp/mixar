name: Renovate

# Self-hosted Renovate with no long-lived PAT: the workflow exchanges its
# GitHub Actions OIDC token for a short-lived GitHub App token via Octo STS.
#
# Prerequisites:
#   1. Install the Octo STS GitHub App on this repository.
#   2. Keep .github/chainguard/renovate.sts.yaml's `subject` pinned to the
#      default branch (main), so only workflows on main can mint the token.

on:
  workflow_dispatch:
  schedule:
    # Twice weekly, Monday and Thursday 03:00 UTC. Renovate opens/updates PRs
    # in these windows.
    - cron: "0 3 * * 1,4"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write # required to federate the OIDC token with Octo STS
      contents: read
    steps:
      - name: Mint Renovate token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: renovate

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          # Renovate 44 is the current engine release line; pin it explicitly
          # so an action update cannot move the engine underneath the config.
          renovate-version: "44"
        env:
          RENOVATE_TOKEN: ${{ steps.octo-sts.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
