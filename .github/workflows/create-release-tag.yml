name: Create release tag

# Bumps Flutter pubspec semver (major|minor|patch), commits, tags v*, and
# starts the Release workflow. GITHUB_TOKEN tag pushes do not trigger other
# workflows, so Release is dispatched explicitly.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      ref:
        description: Branch to bump and tag (empty = this workflow's ref)
        required: false
        type: string
        default: ''
      dry_run:
        description: Compute next version without committing, tagging, or releasing
        required: false
        type: boolean
        default: false
      skip_release:
        description: Commit + tag only; do not start the Release workflow
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: create-release-tag-${{ inputs.ref != '' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: bump-and-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Flutter version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bump-flutter-version.sh "${{ inputs.bump }}" apps/gui-flutter/pubspec.yaml \
            | tee /tmp/bump.out
          grep '^OLD_VERSION=' /tmp/bump.out >> "$GITHUB_OUTPUT"
          grep '^VERSION_NAME=' /tmp/bump.out >> "$GITHUB_OUTPUT"
          grep '^VERSION_BUILD=' /tmp/bump.out >> "$GITHUB_OUTPUT"
          grep '^TAG=' /tmp/bump.out >> "$GITHUB_OUTPUT"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          OLD: ${{ steps.ver.outputs.OLD_VERSION }}
          TAG: ${{ steps.ver.outputs.TAG }}
          NAME: ${{ steps.ver.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail
          echo "dry_run=true bump=${{ inputs.bump }} $OLD → ${NAME}+${{ steps.ver.outputs.VERSION_BUILD }} tag=$TAG"
          echo "No commit, tag, or release was created."
          # Discard working tree change from the bump step.
          git checkout -- apps/gui-flutter/pubspec.yaml

      - name: Commit version bump
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.TAG }}
          NAME: ${{ steps.ver.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag already exists on origin: $TAG" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gui-flutter/pubspec.yaml
          git commit -m "chore(gui-flutter): bump version to ${NAME}"
          git push origin HEAD
          echo "Pushed version commit $(git rev-parse --short HEAD)"

      - name: Create and push annotated tag
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.TAG }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Pushed $TAG → $(git rev-parse HEAD)"

      - name: Dispatch Release workflow
        if: ${{ !inputs.dry_run && !inputs.skip_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.TAG }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f "tag=$TAG"
          echo "Started Release for $TAG (draft when packaging finishes)"
