name: Create release tag

# Bumps Flutter pubspec via `dart pub bump` (major|minor|patch), commits, and
# pushes an annotated v* tag with RELEASE_TOKEN (admin PAT). That tag push
# starts the Release workflow (PAT tag pushes DO trigger workflows; the old
# explicit gh workflow run was redundant and caused double builds).
# See: https://dart.dev/tools/pub/cmd/pub-bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      ref:
        description: Branch to bump and tag (empty = this workflow's ref)
        required: false
        type: string
        default: ''
      dry_run:
        description: Preview next version without committing or tagging
        required: false
        type: boolean
        default: false
      skip_tag:
        description: Commit the version bump only; do not create/push the tag (no Release)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: create-release-tag-${{ inputs.ref != '' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: bump-and-tag
    runs-on: ubuntu-latest
    steps:
      - name: Require RELEASE_TOKEN
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "Missing repository secret RELEASE_TOKEN (admin PAT with contents:write)." >&2
            echo "The PAT owner must be on the Main Protect ruleset bypass list (Always allow)," >&2
            echo "because GitHub Actions cannot be added as a bypass actor on personal repos." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          token: ${{ inputs.dry_run && github.token || secrets.RELEASE_TOKEN }}

      - name: Setup toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Bump Flutter version
        id: ver
        working-directory: apps/gui-flutter
        shell: bash
        run: |
          set -euo pipefail
          OLD="$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}')"
          echo "OLD_VERSION=$OLD" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            mise exec -- dart pub bump "${{ inputs.bump }}" --dry-run | tee /tmp/bump.out
            # "Would update version from 1.0.0+1 to 1.0.1."
            NEW="$(sed -nE 's/.* to ([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?).*/\1/p' /tmp/bump.out | head -n1)"
            if [ -z "$NEW" ]; then
              echo "failed to parse dry-run version from dart pub bump output" >&2
              cat /tmp/bump.out >&2
              exit 1
            fi
          else
            mise exec -- dart pub bump "${{ inputs.bump }}"
            NEW="$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}')"
          fi

          NAME="${NEW%%+*}"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_OUTPUT"
          echo "TAG=v${NAME}" >> "$GITHUB_OUTPUT"
          echo "bump=${{ inputs.bump }} $OLD → $NEW (tag=v${NAME})"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo "dry_run=true — no commit or tag was created."

      - name: Commit version bump
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.TAG }}
          NAME: ${{ steps.ver.outputs.VERSION_NAME }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.skip_tag }}" != "true" ] && git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag already exists on origin: $TAG" >&2
            exit 1
          fi
          # Attribute the commit to the PAT owner (ruleset evaluates the pusher).
          login="$(curl -fsSL -H "Authorization: Bearer ${RELEASE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user | jq -r .login)"
          git config user.name "${login}"
          git config user.email "${login}@users.noreply.github.com"
          git add apps/gui-flutter/pubspec.yaml
          git commit -m "chore(gui-flutter): bump version to ${NAME}"
          git push origin HEAD
          echo "Pushed version commit $(git rev-parse --short HEAD) as ${login}"

      - name: Create and push annotated tag
        if: ${{ !inputs.dry_run && !inputs.skip_tag }}
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.TAG }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Pushed $TAG → $(git rev-parse HEAD)"
          echo "Release workflow should start from this tag push (no separate dispatch)."
