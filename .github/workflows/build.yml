name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  LEFTHOOK: '0'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup moon affected
        uses: ./.github/actions/setup-moon-base

      - name: Setup toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Install native deps
        uses: ./.github/actions/install-native-deps

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          # Shared with test.yml and lint.yml on purpose: all three build the
          # same dev-profile artifacts into the same target dir, so one warm
          # cache entry serves all three. Do not re-split these per workflow —
          # a per-workflow key means three cold builds and three multi-GB
          # caches whenever Cargo.lock changes. release.yml (per-platform
          # release artifacts) and rust-beta-audit.yml (beta toolchain) keep
          # their own keys.
          shared-key: crates-dev
          cache-on-failure: true
          # ort-sys downloads the ONNX Runtime binaries into the user cache
          # dir (~/.cache/ort.pyke.io, ~439 MB), not into ~/.cargo or target/,
          # so rust-cache does not cover it by default. Without this, every
          # cold build re-downloads it.
          cache-directories: ~/.cache/ort.pyke.io

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run build
