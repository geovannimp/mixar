name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (e.g. v0.1.0). Leave empty when triggered by a tag push.
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LEFTHOOK: '0'

jobs:
  build:
    name: package-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            target: appimage
            # The .zsync sidecar must ship with the image: it is the delta
            # source the embedded update information points readers at.
            artifact_pattern: |
              apps/gui-flutter/dist/**/*.AppImage
              apps/gui-flutter/dist/**/*.AppImage.zsync
          - os: macos-latest
            platform: macos
            target: dmg
            artifact_pattern: 'apps/gui-flutter/dist/**/*.dmg'
          - os: windows-latest
            platform: windows
            target: exe
            artifact_pattern: 'apps/gui-flutter/dist/**/*.exe'

    steps:
      - uses: actions/checkout@v7
        with:
          # Tag push uses github.ref; manual rebuild checks out the given tag.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && inputs.tag || github.ref }}

      # Plugin cargokit copies under %PUB_CACHE% hit Hidden AppData via
      # resolve_symlinks.ps1 (Get-Item without -Force). Windows PUB_CACHE is set
      # again after flutter-action (see below).
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "Tag must start with v (got: $TAG)" >&2
              exit 1
              ;;
          esac
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches pubspec version
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          PUBSPEC_VER="$(grep -E '^version:' apps/gui-flutter/pubspec.yaml | head -n1 | awk '{print $2}')"
          PUBSPEC_NAME="${PUBSPEC_VER%%+*}"
          TAG_NAME="${TAG#v}"
          if [ "$TAG_NAME" != "$PUBSPEC_NAME" ]; then
            echo "Tag $TAG does not match pubspec version $PUBSPEC_VER (expected v${PUBSPEC_NAME})" >&2
            exit 1
          fi
          echo "OK: $TAG matches pubspec $PUBSPEC_VER"

      - name: Setup toolchains
        uses: ./.github/actions/setup-toolchains

      # Derive the Windows Flutter pin from mise.toml so the release build
      # cannot drift from the toolchain CI installs.
      - name: Read Flutter version from mise
        if: runner.os == 'Windows'
        id: flutter
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(mise current flutter)" >> "$GITHUB_OUTPUT"

      # Windows Release: official Flutter action sets FLUTTER_ROOT (cargokit
      # run_build_tool.cmd needs it). Keep mise for Rust/Node/ninja; the
      # Flutter version comes from mise.toml via `mise current flutter`.
      # Re-apply PUB_CACHE after this — flutter-action may reset it.
      - name: Set up Flutter (Windows)
        if: runner.os == 'Windows'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Use non-AppData PUB_CACHE (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /c/tmp/pubcache
          echo "PUB_CACHE=C:/tmp/pubcache" >> "$GITHUB_ENV"

      # After flutter-action + the Windows PUB_CACHE override, which reset/redirect it.
      - name: Cache pub
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && 'C:/tmp/pubcache' || '~/.pub-cache' }}
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/gui-flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install native audio deps (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-native-deps

      # `bundled-sqlcipher-vendored-openssl` builds OpenSSL from source, and the
      # MSVC build needs a full Perl plus NASM for its x86-64 assembly.
      #
      # The Perl must be Strawberry, not the `perl` found on PATH: GitHub runs
      # `shell: bash` steps under Git for Windows, whose bash prepends
      # `C:\Program Files\Git\usr\bin` to PATH. That directory contains a
      # trimmed MSYS Perl without Locale::Maketext::Simple, so OpenSSL's
      # `perl ./Configure` dies with exit code 2 even when Strawberry Perl is
      # installed and listed earlier via GITHUB_PATH. Name it explicitly for
      # openssl-src (via OPENSSL_SRC_PERL) instead of relying on PATH.
      - name: Install OpenSSL build tools (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /c/Strawberry/perl/bin/perl.exe ]; then
            choco install -y strawberryperl
          fi
          command -v nasm >/dev/null || choco install -y nasm
          # choco updates the machine PATH, which running shells have already
          # read; publish the directories so the later packaging steps (cargo
          # build of openssl-src) inherit them too.
          printf '%s\n' "C:\\Strawberry\\c\\bin" "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
          PERL_WIN='C:\Strawberry\perl\bin\perl.exe'
          echo "OPENSSL_SRC_PERL=$PERL_WIN" >> "$GITHUB_ENV"
          echo "PERL=$PERL_WIN" >> "$GITHUB_ENV"
          /c/Strawberry/perl/bin/perl.exe -MLocale::Maketext::Simple \
            -e 'print "Locale::Maketext::Simple OK\n"'
          /c/Strawberry/perl/bin/perl.exe -v | head -n 2
          nasm -v

      - name: Install Flutter desktop packaging deps
        uses: ./.github/actions/install-flutter-desktop-deps
        with:
          platform: ${{ matrix.platform }}
          # install-native-deps above already ran `apt-get update`.
          refresh_index: ${{ matrix.platform != 'linux' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          shared-key: release-${{ matrix.platform }}
          cache-on-failure: true

      - name: Scaffold macOS signing (optional)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "MACOS_CERTIFICATE unset — shipping unsigned macOS build"
            exit 0
          fi
          if [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ] || [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "macOS signing secrets incomplete — shipping unsigned" >&2
            exit 0
          fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          if [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
            echo "CODESIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi
          echo "macOS signing keychain ready (notarization not configured in v1)"

      - name: Scaffold Windows signing (optional)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "WINDOWS_CERTIFICATE unset — shipping unsigned Windows build"
            exit 0
          fi
          if [ -z "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "WINDOWS_CERTIFICATE_PASSWORD unset — shipping unsigned" >&2
            exit 0
          fi
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/windows-cert.pfx"
          echo "WINDOWS_PFX_PATH=$RUNNER_TEMP/windows-cert.pfx" >> "$GITHUB_ENV"
          echo "WINDOWS_PFX_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          echo "Windows PFX written — Authenticode/Inno signing hook ready for a follow-up"

      - name: Install Fastforge
        shell: bash
        run: |
          set -euo pipefail
          # PATH Flutter: mise on Linux/macOS, flutter-action on Windows (do not
          # mise exec — that would override FLUTTER_ROOT from flutter-action).
          dart pub global activate fastforge
          flutter config --enable-linux-desktop --enable-macos-desktop --enable-windows-desktop || true

      # appimagetool 1.9.1 has no UPDATE_INFORMATION env lookup and Fastforge
      # passes no such flag, so an image built here would have no update
      # target and no reachable .zsync delta. Put a forwarding wrapper ahead of
      # the real tool on PATH for the next step only: it injects the zsync
      # update information and hands every other argument through untouched.
      - name: Prepare AppImage update information
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REPOSITORY:-}" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
            echo "GITHUB_REPOSITORY must be owner/repo (got '${GITHUB_REPOSITORY:-}')" >&2
            exit 1
          fi
          command -v zsyncmake >/dev/null

          # Resolve the real tool before the wrapper directory joins PATH.
          real_appimagetool="$(command -v appimagetool)"
          real_appimagetool="$(realpath "$real_appimagetool")"
          if [ ! -x "$real_appimagetool" ]; then
            echo "appimagetool is not an executable file: $real_appimagetool" >&2
            exit 1
          fi

          # Quoted heredoc: $VARs below stay unexpanded in the wrapper body.
          wrapper_dir="$RUNNER_TEMP/mixar-appimage-tools"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/appimagetool" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "${MIXAR_APPIMAGETOOL_REAL:?}" \
            --updateinformation "${UPDATE_INFORMATION:?}" "$@"
          WRAPPER
          chmod +x "$wrapper_dir/appimagetool"

          {
            printf 'MIXAR_APPIMAGETOOL_REAL=%s\n' "$real_appimagetool"
            # owner/repo -> owner|repo; the trailing glob names the sidecar
            # published beside the AppImage, so quoted to keep '*' literal.
            printf 'UPDATE_INFORMATION=%s\n' \
              "gh-releases-zsync|${GITHUB_REPOSITORY/\//|}|latest|*.AppImage.zsync"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Package with Fastforge
        working-directory: apps/gui-flutter
        shell: bash
        # `MIXAR_POSTHOG_TOKEN` is read at compile time (`option_env!` in
        # crates/analytics), so it must be in the environment of the `flutter
        # build` that cargokit drives. The project token is `phc_`: public and
        # write-only, the same one the website ships to every visitor. Without
        # it analytics compiles to a no-op and the Settings switch does nothing.
        env:
          MIXAR_POSTHOG_TOKEN: ${{ secrets.POSTHOG_PROJECT_KEY }}
          # openssl-src (SQLCipher's vendored OpenSSL) builds 262-char object
          # paths under the default cargokit target dir, past MSVC's MAX_PATH;
          # cl then fails with C1083 "Cannot open compiler generated file: ''".
          # runner.temp is short (D:\a\_temp) and writable, leaving >100 chars
          # of headroom. Only the Windows CMake reads this.
          MIXAR_CARGOKIT_TEMP_DIR: ${{ runner.temp }}/cargokit
        run: |
          set -euo pipefail
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          # dart pub global run: avoids Windows pub-cache shim PATH issues.
          # Linux: .appimageignore in this cwd excludes bundled libasound/libpipewire.
          dart pub global run fastforge:main package \
            --platform "${{ matrix.platform }}" \
            --targets "${{ matrix.target }}"

      # The sidecar is generated by appimagetool from the finished image, so the
      # pair is only trustworthy after packaging. Reject anything that would
      # publish an image whose updater points somewhere else, or a sidecar whose
      # URL/length/hash does not describe this exact image.
      - name: Verify AppImage zsync artifacts
        if: matrix.platform == 'linux'
        working-directory: apps/gui-flutter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          HEADER_LIMIT = 64 * 1024


          def fail(message):
              raise SystemExit("AppImage zsync verification failed: " + message)


          # One Linux architecture per job: more than one image would make the
          # update target ambiguous instead of merely wrong.
          images = sorted(p for p in Path("dist").rglob("*.AppImage") if p.is_file())
          if not images:
              fail("no AppImage found under dist/")
          if len(images) > 1:
              fail(
                  "expected exactly one AppImage, found {}: {}".format(
                      len(images), ", ".join(str(p) for p in images)
                  )
              )
          image = images[0]

          # zsyncmake writes its sidecar into the current directory, which may be
          # the packaging cwd rather than the AppImage's directory.
          sidecar = Path(str(image) + ".zsync")
          in_workdir = Path(image.name + ".zsync")
          if sidecar != in_workdir:
              beside = sidecar.is_file()
              detached = in_workdir.is_file()
              if beside and detached:
                  fail(
                      "ambiguous sidecars: {} and {}".format(sidecar, in_workdir)
                  )
              if detached:
                  try:
                      os.replace(in_workdir, sidecar)
                  except OSError:
                      sidecar.write_bytes(in_workdir.read_bytes())
                      in_workdir.unlink()

          if not sidecar.is_file():
              fail("missing sidecar {} beside {}".format(sidecar.name, image))
          if sidecar.stat().st_size == 0:
              fail("sidecar {} is empty".format(sidecar))

          expected_update = os.environ.get("UPDATE_INFORMATION")
          if not expected_update:
              fail("UPDATE_INFORMATION is not set")
          try:
              completed = subprocess.run(
                  [str(image.resolve()), "--appimage-updateinformation"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
          except (subprocess.CalledProcessError, OSError) as error:
              fail(
                  "{} --appimage-updateinformation failed: {}".format(image, error)
              )
          reported = completed.stdout.strip()
          if reported != expected_update:
              fail(
                  "embedded update information {!r} != expected {!r}".format(
                      reported, expected_update
                  )
              )

          # Text header only, up to the first blank line; the checksum body below
          # it is binary and deliberately never decoded.
          header = b""
          with open(sidecar, "rb") as stream:
              while True:
                  line = stream.readline()
                  if not line or not line.strip():
                      break
                  header += line
                  if len(header) > HEADER_LIMIT:
                      fail("sidecar header exceeds {} bytes".format(HEADER_LIMIT))
          if not header:
              fail("sidecar {} has no header".format(sidecar))

          try:
              header_text = header.decode("ascii")
          except UnicodeDecodeError as error:
              fail("sidecar header is not ASCII: {}".format(error))

          fields = {}
          for line in header_text.splitlines():
              key, colon, value = line.partition(":")
              if not colon or not key.strip():
                  fail("malformed sidecar header line {!r}".format(line))
              fields[key.strip()] = value.strip()

          if not fields.get("zsync"):
              fail("sidecar header has no zsync version")
          # Relative URL resolves beside the published sidecar.
          for field in ("Filename", "URL"):
              if fields.get(field) != image.name:
                  fail(
                      "sidecar {} {!r} != {!r}".format(
                          field, fields.get(field), image.name
                      )
                  )

          length = fields.get("Length", "")
          if not length.isdigit():
              fail("sidecar Length {!r} is not an integer".format(length))
          size = image.stat().st_size
          if int(length) != size:
              fail("sidecar Length {} != image size {}".format(length, size))

          digest = hashlib.sha1()
          with open(image, "rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          if fields.get("SHA-1") != digest.hexdigest():
              fail(
                  "sidecar SHA-1 {!r} != image sha1 {!r}".format(
                      fields.get("SHA-1"), digest.hexdigest()
                  )
              )

          print("verified {} and {}".format(image, sidecar))
          PY

      # `flutter build windows` collapses the MSBuild log to the bare MSB3073
      # line; the CMake error behind it (a missing PLUGIN_BUNDLED_LIBRARIES
      # entry, say) is dropped as a non-error message. Re-run the generated
      # install script so the real cause lands in the job log.
      - name: Explain Windows INSTALL failure
        if: failure() && matrix.platform == 'windows'
        working-directory: apps/gui-flutter/build/windows/x64
        shell: bash
        run: |
          cmake -DBUILD_TYPE=Release -P cmake_install.cmake 2>&1 | sed -n '1,80p' || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: mixar-${{ matrix.platform }}-${{ steps.tag.outputs.name }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: draft-github-release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.tag != ''
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag metadata
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: mixar-*
          merge-multiple: true

      - name: List assets
        shell: bash
        run: find release-assets -type f -print

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Mixar ${{ steps.tag.outputs.name }}
          draft: true
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.AppImage.zsync
            release-assets/**/*.dmg
            release-assets/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
