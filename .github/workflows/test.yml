name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  LEFTHOOK: '0'
  # Incremental artifacts are ~1.6 GB of the rust-cache entry and only help a
  # hot local loop; disable them in CI. Local dev keeps incremental on.
  CARGO_INCREMENTAL: '0'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup moon affected
        uses: ./.github/actions/setup-moon-base

      - name: Setup toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Install native deps
        uses: ./.github/actions/install-native-deps

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          # Must stay identical to build.yml / lint.yml — see build.yml.
          shared-key: crates-dev
          cache-on-failure: true
          cache-directories: ~/.cache/ort.pyke.io # see build.yml

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      # The shipped mapping bundles are validated by
      # `crates/controller/tests/map_check.rs` (`shipped_mappings_are_valid`)
      # inside the test task above, so no separate `map-check` invocation is
      # needed here — `cargo run -p controller --bin map-check` costs ~40s of
      # extra linking on a cold cache for identical coverage. Run it by hand with
      # `npx moon run rust:test-mappings`.
