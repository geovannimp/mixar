name: Setup moon affected CI
description: Enable moon --affected via env (checkout fetch-depth 0 provides history)

runs:
  using: composite
  steps:
    - name: Enable moon affected
      shell: bash
      run: |
        set -euo pipefail

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "MOON_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
        elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          echo "MOON_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
        else
          echo "MOON_BASE=origin/main" >> "$GITHUB_ENV"
        fi

        # remote = compare against MOON_BASE / default branch (not local dirty state)
        echo "MOON_AFFECTED=remote" >> "$GITHUB_ENV"
