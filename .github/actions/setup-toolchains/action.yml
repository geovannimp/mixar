name: Setup toolchains
description: Install Node and Rust via mise (reads .node-version and rust-toolchain.toml)

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@v4
      with:
        cache: true

    # Prebuilt release binary (vs. `cargo install`, which compiles from source).
    # Same pattern as the cargo-audit step in rust-beta-audit.yml.
    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Cache npm
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
