name: Setup toolchains
description: Install Node, Rust and Flutter via mise (reads .node-version, rust-toolchain.toml and mise.toml)

runs:
  using: composite
  steps:
    # mise resolves `flutter` against the release archive index, which lists
    # releases only: a channel pin (master) is turned into
    # releases/stable/linux/flutter_linux_master-stable.tar.xz and answers 404.
    # mise treats any version whose install directory exists as already
    # installed, so clone the channel branch there before mise install runs.
    # Once mise.toml names a release again this step does nothing.
    - name: Install Flutter from git when pinned to a channel
      shell: bash
      run: |
        set -euo pipefail
        pin="$(sed -n 's/^flutter = { version = "\([^"]*\)".*/\1/p' mise.toml | head -n1)"
        case "$pin" in
          master|beta|dev)
            data_dir="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}"
            dest="$data_dir/installs/flutter/$pin"
            if [ ! -d "$dest/.git" ]; then
              # Shallow: the SDK bootstraps its own Dart SDK from here.
              git clone --depth 1 --branch "$pin" \
                https://github.com/flutter/flutter.git "$dest"
            fi
            # A branch checkout carries no tags, so `git describe` fails and
            # Flutter reports 0.0.0-unknown -- every `flutter: >=x` constraint
            # in pub then fails to solve. Tag the commit with the dev line the
            # channel is on; bump it when master moves past a release.
            if ! git -C "$dest" describe --match '*.*.*' --tags >/dev/null 2>&1; then
              git -C "$dest" tag -f 3.51.0 HEAD
            fi
            ;;
        esac

    - name: Setup mise
      uses: jdx/mise-action@v4
      with:
        cache: true

    - name: Cache npm
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
