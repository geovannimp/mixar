name: Setup toolchains
description: Install Node and Rust via mise (reads .node-version and rust-toolchain.toml)

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@v4
      with:
        cache: true

    - name: Install cargo-nextest
      uses: ./.github/actions/install-nextest

    - name: Cache npm
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
