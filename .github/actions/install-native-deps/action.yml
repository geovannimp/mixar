name: Install native audio deps
description: Install ALSA and PipeWire development packages for CPAL builds on Ubuntu
runs:
  using: composite
  steps:
    - name: Install pkg-config, ALSA, PipeWire, clang
      shell: bash
      run: |
        # Owns `apt-get update`; release.yml pairs this with refresh_index: false.
        sudo apt-get update
        sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev clang
