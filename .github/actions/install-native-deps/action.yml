name: Install native deps
description: Install ALSA/PipeWire (CPAL) and GTK/X11 (Flutter desktop) development packages on Ubuntu
runs:
  using: composite
  steps:
    - name: Install pkg-config, ALSA, PipeWire, GTK/X11, clang
      shell: bash
      run: |
        # Owns `apt-get update`; release.yml pairs this with refresh_index: false.
        sudo apt-get update
        # GTK/X11: window_manager 0.7's `cnativeapi` builds native assets that
        # run `pkg-config --cflags gtk+-3.0 x11 xi`.
        sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev \
          libgtk-3-dev libx11-dev libxi-dev clang
