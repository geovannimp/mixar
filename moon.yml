$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
layer: 'application'
id: 'rust'

workspace:
  inheritedTasks:
    include: []

env:
  CARGO_TERM_COLOR: 'always'

fileGroups:
  sources:
    - 'audio-core/**/*'
    - 'backend-null/**/*'
    - 'backend-miniaudio/**/*'
    - 'backend-cpal/**/*'
    - 'engine-core/**/*'
    - 'engine-dsp/**/*'
    - 'codec/**/*'
    - 'resampler/**/*'
    - 'library-core/**/*'
    - 'library/**/*'
    - 'library-adapters/**/*'
    - 'analyzer-core/**/*'
    - 'analyzer-stratum/**/*'
    - 'analyzer/**/*'
    - 'app-example/**/*'
    - 'tests/**/*'
    - 'Cargo.toml'
    - 'Cargo.lock'

tasks:
  format-check:
    command: 'cargo'
    args: ['fmt', '--', '--check']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  lint:
    command: 'cargo'
    args:
      - 'clippy'
      - '--all-targets'
      - '--all-features'
      - '--'
      - '-D'
      - 'warnings'
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  test:
    command: 'cargo'
    args: ['test', '--release', '--verbose']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true

  build:
    command: 'cargo'
    args: ['build', '--release', '--verbose']
    inputs:
      - '@group(sources)'
    options:
      runInCI: true
